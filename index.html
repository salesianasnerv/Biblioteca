// ═════════════════════ Selector de lector ═════════════════════
function selectorLector(contenedor, alElegir, placeholder) {
  contenedor.innerHTML = '<input class="sel-q" placeholder="' + esc(placeholder || 'Escribe nombre, apellidos o curso…') + '" autocomplete="off"><div class="lista-res sel-l" style="display:none"></div>';
  const q = $('.sel-q', contenedor), l = $('.sel-l', contenedor);
  let res = [], marcado = 0;
  const pintar = () => {
    l.style.display = res.length ? 'block' : 'none';
    l.innerHTML = res.map((x, i) => '<div class="' + (i === marcado ? 'sel' : '') + '" data-i="' + i + '"><b>' + esc(x.nombre) + '</b> <span class="suave">· ' + esc(x.curso) + (x.libros ? ' · ' + x.libros + ' libro(s)' : '') + '</span></div>').join('');
  };
  q.addEventListener('input', async () => {
    const lectores = await cargarLectores();
    const v = q.value.trim();
    res = v.length < 2 ? [] : lectores.filter(x => coincide(x.nombre + ' ' + x.curso + ' ' + x.correo, v)).slice(0, 30);
    marcado = 0; pintar();
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { marcado = Math.min(res.length - 1, marcado + 1); pintar(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { marcado = Math.max(0, marcado - 1); pintar(); e.preventDefault(); }
    if (e.key === 'Enter' && res[marcado]) { e.preventDefault(); alElegir(res[marcado]); }
  });
  l.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) alElegir(res[d.dataset.i]); });
  cargarLectores().catch(() => {});
  setTimeout(() => q.focus(), 30);
}

// ═════════════════════ Prestar ═════════════════════
/** Buscador de libros por código, título o autor con lista desplegable. */
function buscadorLibros(input, lista, fuente, alElegir) {
  let res = [], marcado = 0, t;
  const pintar = () => {
    lista.style.display = res.length ? 'block' : 'none';
    lista.innerHTML = res.map((r, i) => '<div class="' + (i === marcado ? 'sel' : '') + '" data-i="' + i + '">' + r.html + '</div>').join('');
  };
  input.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const v = input.value.trim();
      res = v.length < 2 ? [] : (await fuente(v)).slice(0, 12);
      marcado = 0; pintar();
    }, 120);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && res.length) { marcado = Math.min(res.length - 1, marcado + 1); pintar(); e.preventDefault(); }
    if (e.key === 'ArrowUp' && res.length) { marcado = Math.max(0, marcado - 1); pintar(); e.preventDefault(); }
  });
  lista.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) { const r = res[+d.dataset.i]; res = []; pintar(); alElegir(r); } });
  return { elegidoConIntro: () => { if (res.length && lista.style.display !== 'none') { const r = res[marcado]; res = []; pintar(); alElegir(r); return true; } return false; },
    cerrar: () => { res = []; pintar(); } };
}

/** Lee el código de un libro de lo escaneado (la dirección del QR o el código tal cual). */
function codigoDeLectura(txt) {
  txt = String(txt || '').trim();
  const m = txt.match(/[?&]libro=([^&#]+)/);
  return m ? decodeURIComponent(m[1]) : txt;
}

/** Escáner de QR con la cámara. continuo = sigue leyendo (para devolver muchos seguidos). */
async function escanearQR(alLeer, continuo) {
  abrirVentana('<h2>Escanear QR</h2><div style="position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3">' +
    '<video id="qr-v" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>' +
    '<div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)"></div></div>' +
    '<p id="qr-m" class="suave" style="text-align:center;margin:12px 0 0">Apunta la cámara a la etiqueta del libro…</p>' +
    '<div class="acciones" style="justify-content:center"><button class="b sec" ' + on(() => cerrarVentana()) + '>Terminar</button></div>');
  let flujo = null, parar = false, ultimo = '', cuando = 0;
  S.alCerrarVentana = () => { parar = true; if (flujo) flujo.getTracks().forEach(t => t.stop()); };
  try {
    if (!window.jsQR) await new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; sc.onload = ok; sc.onerror = mal; document.head.appendChild(sc); });
    flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    $('#qr-m').innerHTML = msg('error', 'No se puede usar la cámara. Comprueba que has dado permiso al navegador para usarla.');
    return;
  }
  if (parar) { flujo.getTracks().forEach(t => t.stop()); return; }
  const v = $('#qr-v'); v.srcObject = flujo; await v.play().catch(() => {});
  const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
  const bucle = () => {
    if (parar) return;
    if (v.readyState >= 2 && v.videoWidth) {
      const esc_ = Math.min(1, 640 / v.videoWidth);
      c.width = v.videoWidth * esc_; c.height = v.videoHeight * esc_;
      x.drawImage(v, 0, 0, c.width, c.height);
      const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
      if (r && r.data) {
        const cod = codigoDeLectura(r.data);
        if (cod !== ultimo || Date.now() - cuando > 3000) {
          ultimo = cod; cuando = Date.now();
          if (navigator.vibrate) navigator.vibrate(80);
          if (!continuo) { cerrarVentana(); alLeer(cod); return; }
          $('#qr-m').innerHTML = '<b>' + esc(cod) + '</b>…';
          Promise.resolve(alLeer(cod)).then(t => { if (!parar && t) $('#qr-m').innerHTML = t; });
        }
      }
    }
    setTimeout(() => requestAnimationFrame(bucle), 120);
  };
  bucle();
}

function libroEnLista(x) {
  return '<b>' + esc(x.titulo) + '</b> <span class="suave">· ' + esc(x.autor || '') + '</span><br><span class="peq">' + esc(x.codigo) + '</span> ' + etiqueta(x.estado);
}

// ═════════════════════ Prestar ═════════════════════
function vistaPrestar() {
  const hechos = [];
  let lector = null, reservas = [];
  $('#app').innerHTML =
    '<h2>Prestar un libro</h2>' +
    '<div class="tarjeta"><label>1. ¿Quién se lo lleva?</label><div id="p-lector"></div><div id="p-res"></div></div>' +
    '<div class="tarjeta"><label>2. ¿Qué libro? <span class="suave">Escribe el código, el título o el autor, o escanea su QR</span></label>' +
    '<div class="fila"><input id="p-cod" class="grande crece" placeholder="Código, título o autor…" autocomplete="off">' +
    '<button class="b sec" id="p-qr">📷 Escanear QR</button><button class="b" id="p-btn">Prestar</button></div>' +
    '<div class="lista-res" id="p-lista" style="display:none"></div><div id="p-libro"></div></div><div id="p-hechos"></div>';
  const cod = $('#p-cod'), info = $('#p-libro');
  api('prestamosYReservas').then(d => { reservas = d.reservas; if (lector) pintarReservas(); }).catch(() => {});

  const pintarReservas = () => {
    const r = reservas.filter(x => lector && x.lector === lector.id);
    $('#p-res').innerHTML = r.length ? '<div class="msg info" style="margin-top:10px"><b>Tiene reservado:</b> ' + r.map(x => esc(x.titulo) + ' (' + esc(x.codigo) + ') <button class="b ok peq" ' + on(() => { cod.value = x.codigo; hacer(false); }) + '>Entregar ahora</button>').join(' · ') + '</div>' : '';
  };
  const elegir = x => {
    lector = x;
    $('#p-lector').innerHTML = '<div class="elegido"><div><b>' + esc(x.nombre) + '</b> · ' + esc(x.curso) +
      '<div class="peq suave">' + x.libros + ' libro(s) en préstamo o reservados · máximo ' + S.info.ajustes.max_libros_alumno + '</div></div>' +
      '<button class="b sec peq" ' + on(() => { lector = null; $('#p-res').innerHTML = ''; selectorLector($('#p-lector'), elegir); }) + '>Cambiar</button></div>';
    pintarReservas();
    cod.focus();
  };
  selectorLector($('#p-lector'), elegir);

  const mostrarLibro = async v => {
    try {
      const l = await api('verLibro', v);
      if (cod.value.trim() === v) info.innerHTML = '<p>' + etiqueta(l.estado) + ' <b>' + esc(l.titulo) + '</b> <span class="suave">· ' + esc(l.autor) + '</span>' + (l.reserva ? '<br><span class="peq">Reservado para ' + esc(l.reserva.nombre) + '</span>' : '') + (l.prestamo ? '<br><span class="peq">Prestado a ' + esc(l.prestamo.nombre) + '</span>' : '') + '</p>';
    } catch (e) { if (cod.value.trim() === v) info.innerHTML = '<p class="peq suave">' + esc(textoError(e)) + '</p>'; }
  };
  const busc = buscadorLibros(cod, $('#p-lista'), async q => {
    const cat = await cargarCatalogo();
    const r = [];
    cat.forEach(g => g.ejemplares.forEach(x => { if (x.codigo && x.estado !== 'Baja' && coincide(x.codigo + ' ' + x.titulo + ' ' + x.autor, q)) r.push(x); }));
    r.sort((a, b) => (a.estado === 'Disponible' ? 0 : 1) - (b.estado === 'Disponible' ? 0 : 1));
    return r.map(x => Object.assign({ html: libroEnLista(x) }, x));
  }, x => { cod.value = x.codigo; info.innerHTML = '<p>' + etiqueta(x.estado) + ' <b>' + esc(x.titulo) + '</b> <span class="suave">· ' + esc(x.autor) + '</span></p>'; $('#p-btn').focus(); });

  const hacer = async (forzar) => {
    const v = codigoDeLectura(cod.value);
    if (!lector) { aviso('Primero elige quién se lo lleva.'); return; }
    if (!v) { cod.focus(); return; }
    const btn = $('#p-btn');
    try {
      const r = await conBoton(btn, () => api('prestar', v, lector.id, !!forzar));
      if (r.aviso) {
        if (await confirmar(esc(r.aviso) + '<br><br>¿Prestar igualmente?', 'Prestar igualmente')) return hacer(true);
        return;
      }
      lector.libros++;
      reservas = reservas.filter(x => !(x.lector === lector.id && claveCod(x.codigo) === claveCod(r.codigo)));
      elegir(lector);
      hechos.unshift(r);
      cod.value = ''; info.innerHTML = '';
      cambiosHechos();
      $('#p-hechos').innerHTML = '<h3>Préstamos hechos ahora</h3>' + hechos.map(h => msg('ok', '✓ <b>' + esc(h.titulo) + '</b> (' + esc(h.codigo) + ') → ' + esc(h.nombre) + '. Devolver antes del <b>' + fecha(h.limite) + '</b>')).join('');
      aviso('Prestado a ' + r.nombre);
    } catch (e) { info.innerHTML = msg('error', esc(textoError(e))); }
  };
  $('#p-btn').onclick = () => hacer(false);
  $('#p-qr').onclick = () => escanearQR(c => { cod.value = c; busc.cerrar(); if (lector) hacer(false); else { mostrarLibro(c); aviso('Ahora elige quién se lo lleva.'); } });
  cod.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!busc.elegidoConIntro()) hacer(false); } });
}
function claveCod(c) { c = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); const m = c.match(/^([A-Z]+)0*(\d+)$/); return m ? m[1] + Number(m[2]) : c; }

// ═════════════════════ Devolver ═════════════════════
function vistaDevolver() {
  const hechos = [];
  let prestados = [];
  $('#app').innerHTML = '<h2>Devolver un libro</h2><div class="tarjeta"><label>Código, título, autor o nombre del alumno · o escanea el QR</label>' +
    '<div class="fila"><input id="d-cod" class="grande crece" placeholder="Código, título, autor o alumno…" autocomplete="off">' +
    '<button class="b sec" id="d-qr">📷 Escanear QR</button><button class="b" id="d-btn">Devolver</button></div>' +
    '<div class="lista-res" id="d-lista" style="display:none"></div><div id="d-msg"></div>' +
    '<p class="peq suave" style="margin:8px 0 0">Con «Escanear QR» la cámara se queda abierta: puedes ir pasando los libros uno detrás de otro.</p></div><div id="d-hechos"></div>';
  const cod = $('#d-cod');
  const cargar = () => api('prestamosYReservas').then(d => { prestados = d.prestamos; }).catch(() => {});
  cargar();
  setTimeout(() => cod.focus(), 30);
  const pintarHechos = () => {
    $('#d-hechos').innerHTML = '<h3>Devueltos ahora (' + hechos.length + ')</h3>' + hechos.map(h => msg(h.retraso ? 'aviso' : 'ok', '✓ <b>' + esc(h.titulo) + '</b> (' + esc(h.codigo) + ') — ' + esc(h.nombre) + ', ' + esc(h.curso) + (h.retraso ? ' · <b>' + h.retraso + ' días de retraso</b>' : ''))).join('');
  };
  const devolver = async v => {
    v = codigoDeLectura(v); if (!v) return;
    try {
      const r = await api('devolver', v);
      hechos.unshift(r); cod.value = ''; $('#d-msg').innerHTML = ''; cambiosHechos();
      prestados = prestados.filter(p => claveCod(p.codigo) !== claveCod(r.codigo));
      pintarHechos();
      aviso('Devuelto: ' + r.titulo);
      return '<span style="color:var(--ok)">✓ Devuelto: <b>' + esc(r.titulo) + '</b> (' + esc(r.nombre) + ')</span>';
    } catch (e) { $('#d-msg').innerHTML = msg('error', esc(textoError(e))); return '<span style="color:var(--error)">' + esc(textoError(e)) + '</span>'; }
  };
  const busc = buscadorLibros(cod, $('#d-lista'), async q => prestados.filter(p => coincide(p.codigo + ' ' + p.titulo + ' ' + p.nombre + ' ' + p.curso, q)).map(p =>
    Object.assign({ html: '<b>' + esc(p.titulo) + '</b> <span class="peq">(' + esc(p.codigo) + ')</span><br><span class="peq suave">' + esc(p.nombre) + ' · ' + esc(p.curso) + ' · hasta el ' + fecha(p.limite) + (p.retraso ? ' · <b style="color:var(--error)">' + p.retraso + ' días tarde</b>' : '') + '</span>' }, p)),
    p => devolver(p.codigo));
  $('#d-btn').onclick = async () => { await conBoton($('#d-btn'), () => devolver(cod.value)); cod.focus(); };
  $('#d-qr').onclick = () => escanearQR(c => devolver(c), true);
  cod.addEventListener('keydown', async e => { if (e.key === 'Enter') { e.preventDefault(); if (!busc.elegidoConIntro()) await devolver(cod.value); cod.focus(); } });
}

// ═════════════════════ En préstamo y reservas ═════════════════════
async function vistaPrestamos() {
  $('#app').innerHTML = '<h2>Libros en préstamo</h2><div class="cargando">Cargando…</div>';
  let d;
  try { d = await api('prestamosYReservas'); } catch (e) { $('#app').innerHTML = msg('error', esc(textoError(e))); return; }
  let filtro = '', soloRetraso = false;
  const pintar = () => {
    const ps = d.prestamos.filter(p => (!soloRetraso || p.retraso) && coincide(p.titulo + ' ' + p.codigo + ' ' + p.nombre + ' ' + p.curso, filtro));
    const rs = d.reservas.filter(r => coincide(r.titulo + ' ' + r.codigo + ' ' + r.nombre + ' ' + r.curso, filtro));
    const retrasados = d.prestamos.filter(p => p.retraso).length;
    $('#pr-lista').innerHTML =
      '<h3>Reservas pendientes de recoger (' + d.reservas.length + ')</h3>' +
      (rs.length ? '<div class="tabla"><table><tr><th>Libro</th><th>Para</th><th class="ocultar-movil">Recoger antes del</th><th></th></tr>' + rs.map(r =>
        '<tr><td><b>' + esc(r.titulo) + '</b><div class="peq suave">' + esc(r.codigo) + '</div></td><td>' + esc(r.nombre) + '<div class="peq suave">' + esc(r.curso) + '</div></td><td class="ocultar-movil">' + fecha(r.caduca) + '</td><td><div class="fila">' +
        '<button class="b ok peq" ' + on(async (e, b) => { try { await conBoton(b, () => api('prestar', r.codigo, r.lector, true)); cambiosHechos(); aviso('Entregado a ' + r.nombre); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>✓ Recogido · prestar</button>' +
        '<button class="b peligro peq" ' + on(async (e, b) => { if (await confirmar('¿Cancelar la reserva de «' + esc(r.titulo) + '» para ' + esc(r.nombre) + '?', 'Cancelar reserva')) { try { await api('cancelarReserva', r.id); cambiosHechos(); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } } }) + '>Cancelar</button>' +
        '</div></td></tr>').join('') + '</table></div>' : '<p class="suave">No hay reservas pendientes.</p>') +
      '<h3>Préstamos (' + d.prestamos.length + (retrasados ? ', <span style="color:var(--error)">' + retrasados + ' con retraso</span>' : '') + ')</h3>' +
      (ps.length ? '<div class="tabla"><table><tr><th>Libro</th><th>Lector</th><th class="ocultar-movil">Prestado</th><th>Devolver antes del</th><th></th></tr>' + ps.map(p =>
        '<tr><td><b>' + esc(p.titulo) + '</b><div class="peq suave">' + esc(p.codigo) + '</div></td><td>' + esc(p.nombre) + '<div class="peq suave">' + esc(p.curso) + '</div></td><td class="ocultar-movil">' + fecha(p.desde) + '</td><td>' + fecha(p.limite) + (p.retraso ? '<br><span class="etq Prestado">' + p.retraso + ' días tarde</span>' : '') + '</td><td><div class="fila">' +
        '<button class="b peq" ' + on(async (e, b) => { try { await conBoton(b, () => api('devolver', p.codigo)); cambiosHechos(); aviso('Devuelto'); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>Devuelto</button>' +
        '<button class="b sec peq" ' + on(async (e, b) => { try { const f = await conBoton(b, () => api('renovar', p.id)); aviso('Renovado hasta el ' + fecha(f)); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>Renovar</button>' +
        '</div></td></tr>').join('') + '</table></div>' : '<p class="suave">' + (d.prestamos.length ? 'Ningún préstamo coincide con la búsqueda.' : 'No hay libros prestados.') + '</p>');
  };
  $('#app').innerHTML = '<h2>Libros en préstamo</h2><div class="fila"><input id="pr-q" class="crece" placeholder="Buscar por libro, alumno o curso…"><label class="fila" style="margin:0"><input type="checkbox" id="pr-r"> Solo con retraso</label></div><div id="pr-lista"></div>';
  $('#pr-q').addEventListener('input', e => { filtro = e.target.value; pintar(); });
  $('#pr-r').addEventListener('change', e => { soloRetraso = e.target.checked; pintar(); });
  pintar();
}

// ═════════════════════ Catálogo ═════════════════════
async function vistaCatalogo() {
  const i = S.info;
  $('#app').innerHTML = '<h2>Catálogo</h2>' +
    (i.rol === 'visitante' && !PASE ? msg('info', 'Para reservar un libro, <a href="#" ' + on(e => { e.preventDefault(); mostrarAcceso(); }) + '>entra con tu cuenta del colegio</a>.') : '') +
    '<div class="tarjeta"><div class="fila"><input id="c-q" class="crece" placeholder="Busca por título, autor, editorial…" autocomplete="off">' +
    '<select id="c-e" style="width:auto"><option value="">Todas las etapas</option>' + i.etapas.map(e => '<option>' + esc(e) + '</option>').join('') + '</select>' +
    '<label class="fila" style="margin:0"><input type="checkbox" id="c-d"> Solo disponibles</label>' +
    '<span class="vistas"><button id="v-l">' + ico('lista') + 'Lista</button><button id="v-e">' + ico('estanteria') + 'Estantería</button></span></div></div><div id="c-res" class="cargando">Cargando catálogo…</div>';
  let vista = leerPref('vista', 'lista');
  const marcarVista = () => { $('#v-l').classList.toggle('activo', vista === 'lista'); $('#v-e').classList.toggle('activo', vista === 'estanteria'); };
  marcarVista();
  let cat;
  try { cat = await cargarCatalogo(); } catch (e) { $('#c-res').innerHTML = msg('error', esc(textoError(e))); return; }
  const pg = crearPaginas(() => { pintar(); $('#c-res').scrollIntoView({ block: 'start' }); });
  const pintar = () => {
    const q = $('#c-q').value, et = $('#c-e').value, solo = $('#c-d').checked;
    const r = cat.filter(g => (!et || g.etapa === et) && (!solo || g.ejemplares.some(x => x.estado === 'Disponible')) &&
      (!q || coincide(g.titulo + ' ' + g.autor + ' ' + g.editorial + ' ' + g.genero + ' ' + g.ejemplares.map(x => x.codigo).join(' '), q)));
    const caja = $('#c-res'); caja.className = '';
    const vis = pg.trozo(r);
    const cuerpo = !r.length ? '<p class="suave" style="padding:14px 0">No hay resultados.</p>'
      : vista === 'estanteria' ? estanteria(vis) : vis.map(grupoCatalogo).join('');
    caja.innerHTML = pg.html() + '<div class="tarjeta" style="padding:' + (vista === 'estanteria' ? '18px 10px' : '0 16px') + '">' + cuerpo + '</div>' + pg.html();
  };
  let t; ['#c-q', '#c-e', '#c-d'].forEach(s => $(s).addEventListener(s === '#c-q' ? 'input' : 'change', () => { clearTimeout(t); pg.reset(); t = setTimeout(pintar, 150); }));
  $('#v-l').onclick = () => { vista = 'lista'; guardarPref('vista', vista); marcarVista(); pintar(); };
  $('#v-e').onclick = () => { vista = 'estanteria'; guardarPref('vista', vista); marcarVista(); pintar(); };
  pintar();
  $('#c-q').focus();
}

function grupoCatalogo(g) {
  return '<div class="libro"><div class="izq"><span style="cursor:pointer" ' + on(() => fichaGrupo(g)) + '>' + portadaHtml(g, 'mini') + '</span><div><div class="t">' + esc(g.titulo) + '</div><div class="suave peq">' + esc(g.autor) + (g.editorial ? ' · ' + esc(g.editorial) : '') + '</div>' +
    '<div style="margin-top:4px">' + (g.etapa ? '<span class="etq">' + esc(g.etapa) + '</span> ' : '') + (g.genero ? '<span class="etq">' + esc(g.genero) + '</span>' : '') + '</div></div></div>' +
    '<div style="text-align:right;min-width:150px">' + accionesGrupo(g) + '</div></div>';
}

function fichaGrupo(g) {
  abrirVentana('<div class="ficha-g">' + portadaHtml(g, 'grande') + '<div><h2>' + esc(g.titulo) + '</h2><p class="suave">' + esc(g.autor) + (g.editorial ? ' · ' + esc(g.editorial) : '') + '</p>' +
    '<p>' + (g.etapa ? '<span class="etq">' + esc(g.etapa) + '</span> ' : '') + (g.genero ? '<span class="etq">' + esc(g.genero) + '</span>' : '') + '</p>' +
    '<div id="sinop"></div><div style="text-align:left">' + accionesGrupo(g).replace(/justify-content:flex-end/g, 'justify-content:flex-start').replace(/text-align:right/g, 'text-align:left') + '</div></div></div>');
  const codigos = g.ejemplares.map(x => x.codigo).filter(String);
  if (codigos.length) api('sinopsisDe', codigos).then(t => { const d = $('#sinop'); if (d && t) d.innerHTML = '<div class="sinopsis">' + esc(t) + '</div>'; }).catch(() => {});
}

function accionesGrupo(g) {
  const disp = g.ejemplares.filter(x => x.estado === 'Disponible').length;
  const total = g.ejemplares.filter(x => x.estado !== 'Baja').length;
  let derecha = '';
  if (esGestor()) {
    derecha = '<div class="ejemplares">' + g.ejemplares.map(x =>
      '<div class="fila" style="justify-content:flex-end"><span class="peq">' + esc(x.codigo || 'sin código') + '</span> ' + etiqueta(x.estado) +
      '<button class="b sec peq" ' + on(() => fichaLibro(x.codigo, x)) + '>Ficha</button></div>' +
      (x.prestamo ? '<div class="peq suave" style="text-align:right">' + esc(x.prestamo.nombre) + ' · hasta ' + fecha(x.prestamo.limite) + '</div>' : '') +
      (x.reserva ? '<div class="peq suave" style="text-align:right">Reservado: ' + esc(x.reserva.nombre) + '</div>' : '')).join('') + '</div>';
  } else {
    const vuelve = g.ejemplares.filter(x => x.vuelve).map(x => x.vuelve).sort()[0];
    derecha = disp ? '<span class="etq Disponible">' + disp + ' de ' + total + ' disponible' + (disp > 1 ? 's' : '') + '</span>'
      : '<span class="etq Prestado">No disponible</span>' + (vuelve ? '<div class="peq suave">Vuelve hacia el ' + fecha(vuelve) + '</div>' : '');
    if (S.info.rol === 'visitante' && !PASE && disp) {
      derecha += '<div style="margin-top:6px"><button class="b sec peq" ' + on(() => { cerrarVentana(); mostrarAcceso(); }) + '>Entra para reservar</button></div>';
    }
    if (S.info.rol === 'lector' && S.info.ajustes.reservas_alumnado && disp) {
      derecha += '<div style="margin-top:6px"><button class="b peq" ' + on((e, b) => { cerrarVentana(); reservarGrupo(g, b); }) + '>Reservar</button></div>';
    }
  }
  return derecha;
}

async function reservarGrupo(g, btn) {
  if (S.vistaPrevia) {
    abrirVentana('<h2>Vista previa</h2>' + msg('info', 'Aquí el alumno confirmaría la reserva de <b>' + esc(g.titulo) + '</b> y tendría ' + S.info.ajustes.dias_reserva + ' días para recogerlo. En la vista previa no se reserva de verdad.'));
    return;
  }
  if (!await confirmar('¿Reservar «' + esc(g.titulo) + '»? Tendrás ' + S.info.ajustes.dias_reserva + ' días para recogerlo en la biblioteca.', 'Reservar')) return;
  try {
    const r = await api('reservar', g.ejemplares.filter(x => x.estado === 'Disponible').map(x => x.codigo));
    cambiosHechos();
    abrirVentana('<h2>¡Reservado!</h2>' + msg('ok', 'Has reservado <b>' + esc(r.titulo) + '</b>.') + '<p>Pasa por la biblioteca a recogerlo antes del <b>' + fecha(r.caduca) + '</b>. Si no, la reserva se anulará.</p><div class="acciones"><button class="b" ' + on(() => { cerrarVentana(); ir('mis'); }) + '>Ver mis libros</button></div>');
  } catch (e) { abrirVentana('<h2>No se ha podido reservar</h2>' + msg('error', esc(textoError(e)))); }
  if (S.pestana === 'catalogo') vistaCatalogo();
  if (S.pestana === 'inicio') vistaInicio();
}

// ═════════════════════ Ficha de un libro (también al escanear el QR) ═════════════════════
async function fichaLibro(codigo) {
  abrirVentana('<div class="cargando">Buscando el libro…</div>');
  let l;
  try { l = await api('verLibro', codigo); if (S.vistaPrevia) { delete l.prestamo; delete l.reserva; delete l.revisar; delete l.observaciones; } } catch (e) { $('#contenido').innerHTML = '<h2>Libro</h2>' + msg('error', esc(textoError(e))); return; }
  let html = '<div class="ficha-g">' + portadaHtml({ titulo: l.titulo, autor: l.autor, etapa: l.etapa, portada: l.portada, ejemplares: [l] }, 'grande') + '<div><h2>' + esc(l.titulo) + '</h2><p class="suave">' + esc(l.autor) + (l.editorial ? ' · ' + esc(l.editorial) : '') + '</p>' +
    '<p>' + etiqueta(l.estado) + ' <span class="etq">' + esc(l.codigo) + '</span> ' + (l.etapa ? '<span class="etq">' + esc(l.etapa) + '</span>' : '') + '</p>' +
    (l.sinopsis ? '<div class="sinopsis">' + esc(l.sinopsis) + '</div>' : '') + '</div></div>';
  if (!esGestor()) {
    if (l.estado === 'Disponible' && S.info.rol === 'visitante' && !PASE) {
      html += '<div class="acciones"><button class="b" ' + on(() => { cerrarVentana(); mostrarAcceso(); }) + '>Entra para reservarlo</button></div>';
    } else if (l.estado === 'Disponible' && S.info.rol === 'lector' && S.info.ajustes.reservas_alumnado) {
      html += '<div class="acciones"><button class="b" ' + on((e, b) => { cerrarVentana(); reservarGrupo({ titulo: l.titulo, ejemplares: [l] }, b); }) + '>Reservar este libro</button></div>';
    } else if (l.estado !== 'Disponible') {
      html += '<p>Ahora mismo no está disponible' + (l.vuelve ? '; debería volver hacia el ' + fecha(l.vuelve) : '') + '.</p>';
    }
    $('#contenido').innerHTML = html; return;
  }
  if (l.prestamo) html += msg('aviso', 'Prestado a <b>' + esc(l.prestamo.nombre) + '</b> (' + esc(l.prestamo.curso) + ') desde el ' + fecha(l.prestamo.desde) + '. Devolver antes del <b>' + fecha(l.prestamo.limite) + '</b>.');
  if (l.reserva) html += msg('info', 'Reservado para <b>' + esc(l.reserva.nombre) + '</b> (' + esc(l.reserva.curso) + ') hasta el ' + fecha(l.reserva.caduca) + '.');
  if (l.revisar) html += msg('aviso', '⚠ ' + esc(l.revisar));
  html += '<div class="acciones">';
  if (l.estado === 'Prestado') {
    html += '<button class="b" ' + on(async (e, b) => { try { await conBoton(b, () => api('devolver', l.codigo)); cambiosHechos(); aviso('Devuelto'); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Registrar devolución</button>';
    html += '<button class="b sec" ' + on(async (e, b) => { try { const f = await conBoton(b, () => api('renovar', l.prestamo.id)); aviso('Renovado hasta el ' + fecha(f)); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Renovar</button>';
  }
  if (l.estado === 'Reservado') {
    html += '<button class="b ok" ' + on(async (e, b) => { try { await conBoton(b, () => api('prestar', l.codigo, l.reserva.lector, true)); cambiosHechos(); aviso('Entregado a ' + l.reserva.nombre); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Entregar a ' + esc(l.reserva.nombre.split(' ')[0]) + '</button>';
    html += '<button class="b peligro" ' + on(async () => { try { await api('cancelarReserva', l.reserva.id); cambiosHechos(); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Cancelar reserva</button>';
  }
  if (l.estado === 'Disponible') {
    html += '<button class="b" ' + on(() => elegirParaLibro(l, 'prestar')) + '>Prestar…</button>';
    html += '<button class="b sec" ' + on(() => elegirParaLibro(l, 'reservar')) + '>Reservar para…</button>';
  }
  html += '<button class="b sec" ' + on(() => editarLibro(l)) + '>Editar</button>';
  html += '<button class="b sec" ' + on(() => ventanaQR(l)) + '>Etiqueta QR</button></div><div id="f-extra"></div>';
  $('#contenido').innerHTML = html;
}

function elegirParaLibro(l, que) {
  $('#f-extra').innerHTML = '<label>' + (que === 'prestar' ? '¿A quién se lo prestas?' : '¿Para quién es la reserva?') + '</label><div id="f-sel"></div>';
  selectorLector($('#f-sel'), async x => {
    try {
      if (que === 'prestar') {
        let r = await api('prestar', l.codigo, x.id, false);
        if (r.aviso) { if (!await confirmar(esc(r.aviso) + '<br><br>¿Prestar igualmente?', 'Prestar igualmente')) return; r = await api('prestar', l.codigo, x.id, true); }
        aviso('Prestado a ' + x.nombre + ' hasta el ' + fecha(r.limite));
      } else {
        const r = await api('reservarPara', l.codigo, x.id);
        aviso('Reservado para ' + x.nombre + ' hasta el ' + fecha(r.caduca));
      }
      cambiosHechos(); fichaLibro(l.codigo);
    } catch (e) { $('#f-extra').insertAdjacentHTML('beforeend', msg('error', esc(textoError(e)))); }
  });
}

async function busquedaAutomatica(b, funcion, que, nota) {
  const texto = b.innerHTML;
  let ok = 0, total = 0, saltar = [], error = '';
  b.disabled = true;
  try {
    for (let vuelta = 0; vuelta < 80; vuelta++) {
      b.textContent = 'Buscando ' + que + '… ' + ok + ' encontradas de ' + total;
      const r = await api(funcion, vuelta === 0, saltar);
      ok += r.encontrados; total += r.buscados; saltar = saltar.concat(r.fallidas || []);
      if (r.error) { error = r.error; break; }
      if (!r.quedan || !r.buscados) break;
    }
    cambiosHechos();
    abrirVentana('<h2>Búsqueda de ' + que + '</h2>' + (error && !total ? msg('error', esc(error)) :
      msg('ok', '<b>' + ok + '</b> ' + que + ' encontradas de <b>' + total + '</b> libros con ISBN.') +
      (saltar.length ? msg('aviso', saltar.length + ' libros no se han podido consultar ahora; pulsa el botón otra vez más tarde para reintentarlos.') : '')) +
      '<p class="peq suave">' + nota + '</p>');
  } catch (e) { aviso(textoError(e)); }
  finally { b.disabled = false; b.innerHTML = texto; }
}

function pendienteTejuelo(x) { return /poner tejuelo/i.test(x.revisar || '') && !/PROVISIONAL/i.test(x.revisar || ''); }
function numCodigo(c) { const m = String(c || '').match(/(\d+)\s*$/); return m ? Number(m[1]) : null; }

async function admEtiquetas() {
  let cat;
  try { cat = await cargarCatalogo(); } catch (e) { $('#adm').innerHTML = msg('error', esc(textoError(e))); return; }
  const todos = [];
  cat.forEach(g => g.ejemplares.forEach(x => { if (x.codigo && x.estado !== 'Baja') todos.push(x); }));
  todos.sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es', { numeric: true }));
  const nPend = todos.filter(pendienteTejuelo).length;
  const nProv = todos.filter(x => /PROVISIONAL/i.test(x.revisar || '')).length;
  const quitados = new Set();
  $('#adm').innerHTML =
    '<div class="tarjeta"><h3 class="nivel-t" style="--c:#ee712a">1 · Elige los libros</h3>' +
    '<div class="fila"><select id="et-que" style="width:auto"><option value="pend">Pendientes de tejuelo (' + nPend + ')</option><option value="todos">Todos los libros</option></select>' +
    '<select id="et-e" style="width:auto"><option value="">Todas las etapas</option>' + S.info.etapas.map(e => '<option>' + esc(e) + '</option>').join('') + '</select>' +
    '<span class="fila" style="gap:6px">Del nº <input id="et-d" type="number" min="0" style="width:90px"> al <input id="et-h" type="number" min="0" style="width:90px"></span>' +
    '<input id="et-q" class="crece" placeholder="Buscar título o código…"></div>' +
    (nProv ? '<p class="peq suave" style="margin:10px 0 0">Los ' + nProv + ' libros con código <b>provisional</b> no aparecen como pendientes: confirma antes su etapa en Libros.</p>' : '') + '</div>' +
    '<div class="tarjeta"><h3 class="nivel-t" style="--c:#009abb">2 · Imprime</h3><p class="peq suave" style="margin-top:0">En papel de pegatinas A4. Al imprimir, elige «Tamaño real / 100 %».</p>' +
    '<div class="fila"><button class="b" id="et-qr">' + ico('qr') + ' Etiquetas QR</button><button class="b" id="et-tej">' + ico('marcador') + ' Tejuelos</button></div></div>' +
    '<div class="tarjeta"><h3 class="nivel-t" style="--c:#8a9400">3 · Cuando estén pegados</h3><p class="peq suave" style="margin-top:0">Así dejan de salir como pendientes.</p>' +
    '<div class="fila"><button class="b ok" id="et-ok">✓ Marcar como puestos</button></div></div>' +
    '<div id="et-res"></div>';
  const filtrar = () => {
    const que = $('#et-que').value, e = $('#et-e').value, d = $('#et-d').value, h = $('#et-h').value, q = $('#et-q').value;
    return todos.filter(x => (que === 'todos' || pendienteTejuelo(x)) && (!e || x.etapa === e) &&
      (d === '' || (numCodigo(x.codigo) !== null && numCodigo(x.codigo) >= Number(d))) && (h === '' || (numCodigo(x.codigo) !== null && numCodigo(x.codigo) <= Number(h))) &&
      (!q || coincide(x.codigo + ' ' + x.titulo, q)));
  };
  const elegidos = () => filtrar().filter(x => !quitados.has(x.fila));
  const pintar = () => {
    const r = filtrar(), n = r.filter(x => !quitados.has(x.fila)).length;
    $('#et-qr').innerHTML = ico('qr') + ' Etiquetas QR (' + n + ')';
    $('#et-tej').innerHTML = ico('marcador') + ' Tejuelos (' + n + ')';
    $('#et-ok').textContent = '✓ Marcar como puestos (' + n + ')';
    $('#et-res').innerHTML = '<p class="suave peq">' + n + ' de ' + r.length + ' libros marcados. Quita la marca a los que no quieras imprimir.</p>' +
      '<div class="tabla"><table><tr><th style="width:36px"><input type="checkbox" id="et-todos" ' + (n === r.length && n ? 'checked' : '') + '></th><th>Código</th><th>Título</th><th class="ocultar-movil">Etapa</th></tr>' +
      r.slice(0, 500).map(x => '<tr><td><input type="checkbox" data-f="' + x.fila + '" ' + (quitados.has(x.fila) ? '' : 'checked') + '></td><td style="white-space:nowrap">' + tejueloHtml(x, 'mini-tej') + ' ' + esc(x.codigo) + '</td><td>' + esc(x.titulo) + '</td><td class="ocultar-movil">' + esc(x.etapa) + '</td></tr>').join('') +
      '</table></div>' + (r.length > 500 ? '<p class="peq suave">Se muestran los 500 primeros; usa los filtros para afinar.</p>' : '');
  };
  $('#et-res').addEventListener('change', e => {
    const c = e.target;
    if (c.id === 'et-todos') { filtrar().forEach(x => c.checked ? quitados.delete(x.fila) : quitados.add(x.fila)); }
    else if (c.dataset.f) { const f = Number(c.dataset.f); c.checked ? quitados.delete(f) : quitados.add(f); }
    pintar();
  });
  let t; ['#et-que', '#et-e', '#et-d', '#et-h', '#et-q'].forEach(sel => $(sel).addEventListener('input', () => { clearTimeout(t); t = setTimeout(pintar, 150); }));
  const comprobar = max => { const r = elegidos(); if (!r.length) { aviso('No hay ningún libro marcado.'); return null; } if (r.length > max) { aviso('Son ' + r.length + '. Imprime como máximo ' + max + ' de una vez (usa el rango de números).'); return null; } return r; };
  $('#et-qr').onclick = () => { const r = comprobar(300); if (r) imprimirEtiquetas(r); };
  $('#et-tej').onclick = () => { const r = comprobar(500); if (r) imprimirTejuelos(r); };
  $('#et-ok').onclick = async () => {
    const r = elegidos().filter(pendienteTejuelo);
    if (!r.length) return aviso('Ninguno de los marcados estaba pendiente.');
    if (!await confirmar('¿Marcar ' + r.length + ' libro(s) como «tejuelo puesto»? Dejarán de salir como pendientes.', 'Marcar como puestos')) return;
    try { await api('marcarTejuelosPuestos', r.map(x => x.fila)); aviso(r.length + ' libros marcados como puestos'); await cambiosHechos(); admEtiquetas(); }
    catch (e) { aviso(textoError(e)); }
  };
  pintar();
}

function isbnOk(i) {
  i = String(i || '').replace(/[^0-9Xx]/g, '').toUpperCase();
  if (/^\d{9}[\dX]$/.test(i)) { let s = 0; for (let k = 0; k < 10; k++) s += (10 - k) * (i[k] === 'X' ? 10 : +i[k]); return s % 11 === 0; }
  if (/^\d{13}$/.test(i)) { let s = 0; for (let k = 0; k < 13; k++) s += +i[k] * (k % 2 ? 3 : 1); return s % 10 === 0; }
  return false;
}

async function admRevision() {
  let cat;
  try { cat = await cargarCatalogo(); } catch (e) { $('#adm').innerHTML = msg('error', esc(textoError(e))); return; }
  const info = g => {
    const v = g.ejemplares.filter(x => x.estado !== 'Baja');
    return { g, x: v[0] || g.ejemplares[0], activos: v.length,
      faltaPortada: !g.portada && v.every(x => x.estadoPortada !== 'no'),
      faltaSinopsis: v.every(x => x.estadoSinopsis === ''),
      faltaIsbn: !v.some(x => isbnOk(x.isbn)) };
  };
  const cache = {}, saltados = new Set();
  let pos = 0, cola = [];
  $('#adm').innerHTML = '<div class="tarjeta"><div class="fila"><select id="rv-f" style="width:auto"><option value="cualquiera">Les falta portada o sinopsis</option><option value="portada">Les falta la portada</option><option value="sinopsis">Les falta la sinopsis</option><option value="isbn">No tienen ISBN válido</option></select>' +
    '<select id="rv-e" style="width:auto"><option value="">Todas las etapas</option>' + S.info.etapas.map(e => '<option>' + esc(e) + '</option>').join('') + '</select>' +
    '<span id="rv-prog" class="suave peq"></span><button class="b sec peq" style="margin-left:auto" ' + on(() => irAdmin('libros')) + '>Terminar</button></div></div><div id="rv-libro"></div><div id="rv-cand"></div>';
  const armarCola = () => {
    const f = $('#rv-f').value, e = $('#rv-e').value;
    cola = cat.map(info).filter(i => i.activos && (!e || i.g.etapa === e) && !saltados.has(i.x.fila) &&
      (f === 'portada' ? i.faltaPortada : f === 'sinopsis' ? i.faltaSinopsis : f === 'isbn' ? i.faltaIsbn : (i.faltaPortada || i.faltaSinopsis)));
    pos = 0; mostrar();
  };
  const pedir = (fila, otro) => {
    const k = fila + '|' + (otro || '');
    if (!cache[k]) cache[k] = api('candidatosLibro', fila, otro || '').catch(e => { delete cache[k]; throw e; });
    return cache[k];
  };
  const siguiente = () => { pos++; mostrar(); };
  async function mostrar(otro) {
    if (pos >= cola.length) {
      $('#rv-prog').textContent = '';
      $('#rv-libro').innerHTML = msg('ok', '¡No quedan libros en esta lista! Cambia el filtro de arriba o pulsa «Terminar».'); $('#rv-cand').innerHTML = ''; return;
    }
    const it = cola[pos], g = it.g, x = it.x;
    $('#rv-prog').textContent = 'Libro ' + (pos + 1) + ' de ' + cola.length;
    $('#rv-libro').innerHTML = '<div class="tarjeta"><div class="ficha-g">' + portadaHtml(g, 'grande') + '<div><h2 style="margin-top:0">' + esc(g.titulo) + '</h2>' +
      '<p class="suave" style="margin:0 0 6px">' + esc(g.autor || 'Autor desconocido') + (g.editorial ? ' · ' + esc(g.editorial) : '') + '</p>' +
      '<p class="peq">' + (g.etapa ? '<span class="etq">' + esc(g.etapa) + '</span> ' : '') + '<span class="etq">' + it.activos + ' ejemplar(es): ' + esc(g.ejemplares.map(e => e.codigo).filter(String).slice(0, 4).join(', ')) + '</span> ' +
      (isbnOk(x.isbn) ? '<span class="etq">ISBN ' + esc(x.isbn) + '</span>' : '<span class="etq aviso">Sin ISBN válido</span>') + '</p>' +
      '<div class="rev-op"><b style="font-size:14px">Rellenar:</b>' +
      '<label><input type="checkbox" id="rv-p" ' + (it.faltaPortada ? 'checked' : '') + '> Portada</label>' +
      '<label><input type="checkbox" id="rv-s" ' + (it.faltaSinopsis ? 'checked' : '') + '> Sinopsis</label>' +
      '<label><input type="checkbox" id="rv-i" ' + (it.faltaIsbn ? 'checked' : '') + '> ISBN</label></div>' +
      '<div class="fila"><button class="b sec" id="rv-saltar">Saltar</button><button class="b peligro" id="rv-no">Ninguna sirve</button>' +
      '<input id="rv-otro" class="crece" placeholder="Buscar con otro título…" value="' + esc(otro || '') + '" style="max-width:320px"><button class="b sec" id="rv-buscar">' + ico('buscar') + '</button></div>' +
      '</div></div></div>';
    $('#rv-saltar').onclick = () => { saltados.add(x.fila); siguiente(); };
    $('#rv-no').onclick = async () => { try { await api('descartarCandidatos', x.fila); g.ejemplares.forEach(e => { if (e.estadoPortada === '') e.estadoPortada = 'no'; if (e.estadoSinopsis === '') e.estadoSinopsis = 'no'; }); siguiente(); } catch (e) { aviso(textoError(e)); } };
    const buscarOtro = () => { const v = $('#rv-otro').value.trim(); if (v) mostrar(v); };
    $('#rv-buscar').onclick = buscarOtro;
    $('#rv-otro').addEventListener('keydown', e => { if (e.key === 'Enter') buscarOtro(); });
    $('#rv-cand').innerHTML = '<div class="cargando">Buscando en Google Books y Open Library…</div>';
    let cands;
    try { cands = await pedir(x.fila, otro); } catch (e) { $('#rv-cand').innerHTML = msg('error', esc(textoError(e))); return; }
    if (cola[pos] !== it) return;   // ya se ha pasado a otro libro
    if (cola[pos + 1]) pedir(cola[pos + 1].x.fila).catch(() => {});   // adelantar el siguiente
    $('#rv-cand').innerHTML = !cands.length ? msg('aviso', 'No se ha encontrado nada con este título. Prueba «Buscar con otro título» (por ejemplo, solo una parte del título) o pulsa «Ninguna sirve».') :
      '<h3>Elige la que corresponda a este libro</h3><div class="cand-grid">' + cands.map((c, n) =>
        '<div class="cand"><div class="arriba">' + (c.portada ? '<img src="' + esc(c.portada) + '" alt="" referrerpolicy="no-referrer" loading="lazy">' : '<span class="sinimg">sin portada</span>') +
        '<div><b>' + esc(c.titulo) + '</b><div class="dat">' + esc(c.autor) + '<br>' + esc([c.editorial, c.anio].filter(String).join(' · ')) + (c.isbn ? '<br>ISBN ' + esc(c.isbn) : '') + '</div></div></div>' +
        (c.sinopsis ? '<div class="sin" title="' + esc(c.sinopsis) + '">' + esc(c.sinopsis) + '</div>' : '<div class="dat">Sin sinopsis</div>') +
        '<span class="fuente">' + esc(c.fuente) + '</span><button class="b" data-n="' + n + '">Usar esta</button></div>').join('') + '</div>';
    $('#rv-cand').querySelectorAll('button[data-n]').forEach(b => b.onclick = async () => {
      const c = cands[+b.dataset.n];
      const op = { portada: $('#rv-p').checked && !!c.portada, sinopsis: $('#rv-s').checked && !!c.sinopsis, isbn: $('#rv-i').checked && !!c.isbn };
      if (!op.portada && !op.sinopsis && !op.isbn) return aviso('Esa opción no trae nada de lo marcado en «Rellenar».');
      try {
        await conBoton(b, () => api('aplicarCandidato', x.fila, c, op));
        g.ejemplares.forEach(e => { if (op.portada) { e.portada = c.portada; e.estadoPortada = 'si'; } if (op.sinopsis) e.estadoSinopsis = 'si'; if (op.isbn && !isbnOk(e.isbn)) e.isbn = c.isbn; });
        if (op.portada) g.portada = c.portada;
        aviso('Guardado: ' + [op.portada && 'portada', op.sinopsis && 'sinopsis', op.isbn && 'ISBN'].filter(Boolean).join(', '));
        siguiente();
      } catch (e) { aviso(textoError(e)); }
    });
  }
  ['#rv-f', '#rv-e'].forEach(sel => $(sel).addEventListener('change', armarCola));
  armarCola();
}

function editarLibro(l) {
  const nuevo = !l;
  l = l || { codigo: '', etapa: '', titulo: '', autor: '', editorial: '', isbn: '', genero: '', observaciones: '', revisar: '' };
  const campo = (id, txt, valor, extra) => '<div class="' + (extra || '') + '"><label>' + txt + '</label><input id="el-' + id + '" value="' + esc(valor) + '"></div>';
  abrirVentana('<h2>' + (nuevo ? 'Nuevo libro' : 'Editar libro') + '</h2>' +
    (nuevo ? '<div class="fila"><div class="crece"><label>ISBN (si lo tiene, rellena el resto solo)</label><input id="el-isbn" placeholder="978…"></div><button class="b sec" id="el-buscar" style="align-self:flex-end">Buscar datos</button></div><div id="el-isbn-msg"></div>' : '') +
    '<div class="rejilla">' +
    campo('titulo', 'Título *', l.titulo, 'ancho') + campo('autor', 'Autor', l.autor) + campo('editorial', 'Editorial', l.editorial) +
    '<div><label>Etapa</label><select id="el-etapa"><option value="">—</option>' + S.info.etapas.map(e => '<option' + (e === l.etapa ? ' selected' : '') + '>' + esc(e) + '</option>').join('') + '</select></div>' +
    (nuevo ? campo('codigo', 'Código (vacío = siguiente libre)', l.codigo) : '<div><label>Código</label><div class="fila" style="flex-wrap:nowrap"><input id="el-codigo" value="' + esc(l.codigo) + '"><button class="b sec peq" id="el-sig" title="Pone el siguiente número libre de la etapa elegida">Siguiente libre</button></div></div>') +
    (nuevo ? '' : campo('isbn', 'ISBN', l.isbn)) + campo('genero', 'Género', l.genero) +
    (nuevo ? '<div><label>Nº de ejemplares iguales</label><input id="el-n" type="number" min="1" max="50" value="1"></div>' : '') +
    '<div class="ancho"><label>Portada (dirección de la imagen)</label><div class="fila" style="flex-wrap:nowrap;align-items:flex-start"><input id="el-portada" value="' + esc(/^https?:/.test(l.portada || '') ? l.portada : '') + '" placeholder="Vacío = portada dibujada automáticamente">' +
      '<span id="el-prev">' + portadaHtml({ titulo: l.titulo || 'Título', autor: l.autor, etapa: l.etapa, portada: l.portada, ejemplares: [] }, 'mini') + '</span></div>' +
      '<div class="peq suave" style="margin-top:4px">Para poner una portada a mano: búscala en Google Imágenes, haz clic derecho sobre ella → «Copiar dirección de imagen» y pégala aquí.</div></div>' +
    '<div class="ancho"><label>Sinopsis</label><textarea id="el-sinopsis" style="min-height:110px"' + (nuevo ? '' : ' disabled placeholder="Cargando…"') + '></textarea></div>' +
    '<div class="ancho"><label>Observaciones</label><textarea id="el-observaciones">' + esc(l.observaciones) + '</textarea></div>' +
    (nuevo ? '' : '<div class="ancho"><label>Avisos para revisar</label><textarea id="el-revisar" placeholder="Sin avisos">' + esc(l.revisar) + '</textarea></div>') +
    '</div><div id="el-msg"></div><div class="acciones"><button class="b" id="el-guardar">Guardar</button>' +
    (nuevo ? '' : (l.revisar ? '<button class="b ok" id="el-rev">✓ Marcar como revisado</button>' : '') +
      '<button class="b sec" ' + on(() => ventanaQR(l)) + '>Etiqueta QR</button>' +
      '<button class="b sec" ' + on(() => historialLibro(l)) + '>Préstamos de este libro</button>' +
      (l.estado === 'Baja' ? '<button class="b sec" id="el-recu">Recuperar (quitar la baja)</button>' : '<button class="b peligro" id="el-baja">Dar de baja</button>')) +
    '</div>');
  const val = id => { const e = $('#el-' + id); return e ? e.value : undefined; };
  const recogida = () => { const d = {}; ['titulo', 'autor', 'editorial', 'etapa', 'codigo', 'isbn', 'genero', 'observaciones', 'revisar', 'portada'].forEach(k => { const v = val(k); if (v !== undefined) d[k] = v; });
    if (!$('#el-sinopsis').disabled) d.sinopsis = val('sinopsis');
    return d; };
  if (!nuevo) api('leerSinopsis', l.fila).then(t => { const e = $('#el-sinopsis'); if (e) { e.value = t; e.disabled = false; e.placeholder = 'Sin sinopsis'; } }).catch(() => {});
  if ($('#el-sig')) $('#el-sig').onclick = async () => {
    const e = val('etapa');
    if (!e) return aviso('Elige primero la etapa.');
    try { $('#el-codigo').value = await conBoton($('#el-sig'), () => api('siguienteCodigo', e)); aviso('Recuerda poner el tejuelo nuevo al libro.'); } catch (er) { aviso(textoError(er)); }
  };
  $('#el-portada').addEventListener('input', () => { $('#el-prev').innerHTML = portadaHtml({ titulo: val('titulo') || 'Título', autor: val('autor'), etapa: val('etapa'), portada: val('portada'), ejemplares: [] }, 'mini'); });
  const tras = async (texto) => { cerrarVentana(); aviso(texto); await cambiosHechos(); if (S.pestana === 'admin') vistaAdmin(); else if (S.pestana === 'catalogo') vistaCatalogo(); };
  if (nuevo) {
    const sugerir = async () => { const e = val('etapa'); $('#el-codigo').placeholder = e ? 'Se asignará ' + await api('siguienteCodigo', e).catch(() => '') : 'Elige la etapa'; };
    $('#el-etapa').addEventListener('change', sugerir);
    $('#el-buscar').onclick = async () => {
      try {
        const r = await conBoton($('#el-buscar'), () => api('buscarISBN', val('isbn')));
        if (r.noEncontrado) { $('#el-isbn-msg').innerHTML = msg('aviso', 'No he encontrado ese ISBN. Rellena los datos a mano.'); return; }
        ['titulo', 'autor', 'editorial', 'portada', 'sinopsis'].forEach(k => { if (r[k]) $('#el-' + k).value = r[k]; });
        $('#el-portada').dispatchEvent(new Event('input'));
        $('#el-isbn-msg').innerHTML = msg('ok', 'Datos encontrados. Revísalos antes de guardar.');
      } catch (e) { $('#el-isbn-msg').innerHTML = msg('error', esc(textoError(e))); }
    };
    $('#el-isbn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#el-buscar').click(); });
  }
  $('#el-guardar').onclick = async () => {
    try {
      const r = await conBoton($('#el-guardar'), () => api('guardarLibro', nuevo ? null : l.fila, recogida(), nuevo ? val('n') : null));
      tras(r.nuevos ? 'Libro dado de alta: ' + r.nuevos.join(', ') : r.sinCambios ? 'No había cambios' : 'Cambios guardados');
    } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-rev')) $('#el-rev').onclick = async () => {
    try { await conBoton($('#el-rev'), () => api('guardarLibro', l.fila, Object.assign(recogida(), { revisar: '' }))); tras('Marcado como revisado'); }
    catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-baja')) $('#el-baja').onclick = async () => {
    const motivo = prompt('¿Por qué se da de baja? (perdido, deteriorado…)');
    if (motivo === null) return;
    try { await api('bajaLibro', l.fila, motivo); tras('Libro dado de baja'); } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-recu')) $('#el-recu').onclick = async () => {
    try { await api('recuperarLibro', l.fila); tras('Libro recuperado'); } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
}

async function historialLibro(l) {
  abrirVentana('<h2>Préstamos de «' + esc(l.titulo) + '»</h2><div class="cargando">Cargando…</div>');
  try {
    const h = await api('historialLibro', l.codigo);
    $('#contenido').innerHTML = '<h2>Préstamos de «' + esc(l.titulo) + '»</h2>' + (h.length ? '<div class="tabla"><table><tr><th>Lector</th><th>Prestado</th><th>Devuelto</th></tr>' + h.map(p => '<tr><td>' + esc(p.nombre) + '<div class="peq suave">' + esc(p.curso) + '</div></td><td>' + fecha(p.desde) + '</td><td>' + (p.devuelto ? fecha(p.devuelto) : '<span class="etq Prestado">Aún no</span>') + '</td></tr>').join('') + '</table></div>' : '<p class="suave">Este libro no se ha prestado nunca.</p>');
  } catch (e) { $('#contenido').innerHTML = msg('error', esc(textoError(e))); }
}

const iconoImg = new Image();
const iconoListo = new Promise(ok => { iconoImg.onload = ok; iconoImg.onerror = ok; });
iconoImg.src = ICONO_COLEGIO;

/** QR con el símbolo del colegio en el centro (corrección de errores alta para que se siga leyendo). */
function qrDataUrl(texto, tam) {
  const div = document.createElement('div');
  new QRCode(div, { text: texto, width: tam, height: tam, correctLevel: QRCode.CorrectLevel.H });
  const qr = div.querySelector('canvas');
  if (!qr) return div.querySelector('img').src;
  const c = document.createElement('canvas'); c.width = tam; c.height = tam;
  const x = c.getContext('2d');
  x.drawImage(qr, 0, 0, tam, tam);
  if (iconoImg.complete && iconoImg.naturalWidth) {
    const hueco = Math.round(tam * 0.24), ini = Math.round((tam - hueco) / 2), r = hueco * 0.18;
    x.fillStyle = '#fff';
    x.beginPath();
    x.moveTo(ini + r, ini); x.arcTo(ini + hueco, ini, ini + hueco, ini + hueco, r); x.arcTo(ini + hueco, ini + hueco, ini, ini + hueco, r);
    x.arcTo(ini, ini + hueco, ini, ini, r); x.arcTo(ini, ini, ini + hueco, ini, r); x.closePath(); x.fill();
    const m = Math.round(hueco * 0.06);
    x.drawImage(iconoImg, ini + m, ini + m, hueco - 2 * m, hueco - 2 * m);
  }
  return c.toDataURL('image/png');
}

function lineas(ctx, texto, ancho, maxLineas) {
  const pal = String(texto).split(' '), out = [];
  let l = '';
  pal.forEach(p => { const prueba = l ? l + ' ' + p : p; if (ctx.measureText(prueba).width > ancho && l) { out.push(l); l = p; } else l = prueba; });
  if (l) out.push(l);
  if (out.length > maxLineas) { out.length = maxLineas; out[maxLineas - 1] += '…'; }
  return out;
}

function etiquetaPng(l) {
  return iconoListo.then(() => new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 900; c.height = 400;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, 900, 400);
      x.fillStyle = (COLOR_ETAPA[l.etapa] || ['#64748B'])[0]; x.fillRect(0, 0, 14, 400);
      x.drawImage(img, 40, 30, 340, 340);
      let tam = 46;
      do { x.font = 'bold ' + tam + 'px "Fira Sans", sans-serif'; tam -= 2; } while (x.measureText(l.codigo).width > 470 && tam > 24);
      x.fillStyle = '#1E293B'; x.fillText(l.codigo, 405, 95);
      x.font = '28px "Fira Sans", sans-serif'; x.fillStyle = '#334155';
      lineas(x, l.titulo, 465, 3).forEach((t, i) => x.fillText(t, 405, 145 + i * 36));
      x.fillStyle = '#E2E8F0'; x.fillRect(405, 286, 465, 2);
      x.fillStyle = '#009abb'; x.font = 'bold 30px "Fira Sans", sans-serif'; x.fillText('Biblioteca', 405, 328);
      x.fillStyle = '#64748B'; x.font = '21px "Fira Sans", sans-serif'; x.fillText('Escuelas Salesianas María Auxiliadora', 405, 360);
      ok(c.toDataURL('image/png'));
    };
    img.src = qrDataUrl(urlLibro(l.codigo), 340);
  }));
}

async function ventanaQR(l) {
  if (!l.codigo) { aviso('Este libro no tiene código todavía.'); return; }
  abrirVentana('<h2>Etiqueta QR</h2><div class="cargando">Generando…</div>');
  const png = await etiquetaPng(l);
  $('#contenido').innerHTML = '<h2>Etiqueta QR · ' + esc(l.codigo) + '</h2><div class="qr-vista"><img src="' + png + '" alt="Etiqueta"></div>' +
    '<p class="peq suave">Al escanearlo con el móvil se abre la ficha de este libro en la web: quien gestiona puede prestarlo o devolverlo, y el alumnado puede reservarlo.' + (S.info.url ? '' : ' (La dirección de la web aparecerá cuando esté publicada.)') + '</p>' +
    '<div class="acciones"><a class="b" style="text-decoration:none" download="' + esc(l.codigo) + '.png" href="' + png + '"><button class="b">Descargar imagen</button></a>' +
    '<button class="b sec" ' + on(() => imprimirEtiquetas([l])) + '>Imprimir</button></div>' +
    '<h3>Tejuelo para el lomo</h3><p>' + tejueloHtml(l, 'muestra-tej') + '</p><div class="acciones"><button class="b sec" ' + on(() => imprimirTejuelos([l])) + '>Imprimir tejuelo</button></div>' +
    '<p class="peq suave">Si la descarga no empieza, mantén pulsada la imagen (o clic derecho) y elige «Guardar imagen».</p>';
}

async function imprimirEtiquetas(lista) {
  aviso('Preparando ' + lista.length + ' etiqueta(s)…');
  await iconoListo;
  await new Promise(r => setTimeout(r, 50));
  $('#imprimir').innerHTML = '<div class="etiquetas">' + lista.map(l =>
    '<div class="etiqueta" style="--c:' + (COLOR_ETAPA[l.etapa] || ['#64748B'])[0] + '"><img src="' + qrDataUrl(urlLibro(l.codigo), 240) + '"><div class="txt">' +
    '<div class="c' + (String(l.codigo).length > 11 ? ' largo' : '') + '">' + esc(l.codigo) + '</div><div class="ti">' + esc(l.titulo) + '</div>' +
    '<div class="pie"><b>Biblioteca</b><span>Escuelas Salesianas María Auxiliadora</span></div></div></div>').join('') + '</div>';
  setTimeout(() => window.print(), 300);
}

const COLOR_ETAPA = { 'Infantil': ['#ee712a', 'INFANTIL'], 'Primaria': ['#8a9400', 'PRIMARIA'], 'ESO/Bachillerato': ['#007791', 'ESO-BACH'] };
function tejueloHtml(l, clase) {
  const c = COLOR_ETAPA[l.etapa] || ['#777', 'SIN ETAPA'];
  const m = String(l.codigo || '').match(/(\d+)\s*$/);
  const num = m ? m[1] : (l.codigo || '?');
  return '<span class="' + clase + '"><span class="banda" style="background:' + c[0] + '">' + c[1] + '</span><span class="num">' + esc(num) + '</span>' +
    (clase === 'tejuelo' ? '<span class="pie">' + esc(String(l.codigo)) + '</span>' : '') + '</span>';
}
function imprimirTejuelos(lista) {
  $('#imprimir').innerHTML = '<div class="tejuelos">' + lista.map(l => tejueloHtml(l, 'tejuelo')).join('') + '</div>';
  setTimeout(() => window.print(), 200);
}

// ───── Alumnado (lectores) ─────
const ETAPAS_ALUMNADO = ['Infantil', 'Primaria', 'ESO', 'Bachillerato', 'FP', 'Otros'];
function etapaDeCurso(c) {
  c = String(c || '');
  if (/infantil/i.test(c)) return 'Infantil';
  if (/primaria/i.test(c)) return 'Primaria';
  if (/\bESO\b/i.test(c)) return 'ESO';
  if (/bachiller/i.test(c)) return 'Bachillerato';
  if (/\bFP\b|ciclo/i.test(c)) return 'FP';
  return 'Otros';
}
/** Orden natural: etapa → número de curso → resto del nombre. */
function claveCurso(c) {
  const e = ETAPAS_ALUMNADO.indexOf(etapaDeCurso(c));
  const n = (String(c).match(/\d+/) || [99])[0];
  return e + '|' + String(n).padStart(2, '0') + '|' + norm(c);
}

async function admLectores() {
  let ls;
  try { ls = await api('lectoresTodos'); } catch (e) { $('#adm').innerHTML = msg('error', esc(textoError(e))); return; }
  ls.forEach(x => { x.etapa = etapaDeCurso(x.curso); x._orden = claveCurso(x.curso) + '|' + norm(x.apellidos + ' ' + x.nombre); });
  ls.sort((a, b) => a._orden < b._orden ? -1 : 1);
  const activos = ls.filter(x => x.estado === 'Activo').length;
  const etapasHay = ETAPAS_ALUMNADO.filter(e => ls.some(x => x.etapa === e));
  $('#adm').innerHTML = '<div class="tarjeta"><div class="fila"><input id="ae-q" class="crece" placeholder="Buscar por nombre o correo…">' +
    '<select id="ae-e" style="width:auto"><option value="">Todas las etapas</option>' + etapasHay.map(e => '<option>' + e + '</option>').join('') + '</select>' +
    '<select id="ae-c" style="width:auto"></select>' +
    '<select id="ae-f" style="width:auto"><option value="Activo">Activos (' + activos + ')</option><option value="Baja">De baja (' + (ls.length - activos) + ')</option><option value="">Todos</option></select></div>' +
    '<div class="fila" style="margin-top:10px"><button class="b" ' + on(() => editarLector(null)) + '>+ Nuevo lector</button><button class="b sec" ' + on(importarListado) + '>Importar listado de Google (cada curso)</button></div></div><div id="ae-res"></div>';
  const rellenarCursos = () => {
    const e = $('#ae-e').value, f = $('#ae-f').value, antes = $('#ae-c').value;
    const cursos = [...new Set(ls.filter(x => (!e || x.etapa === e) && (!f || x.estado === f)).map(x => x.curso).filter(String))].sort((a, b) => claveCurso(a) < claveCurso(b) ? -1 : 1);
    const cuenta = c => ls.filter(x => x.curso === c && (!f || x.estado === f)).length;
    $('#ae-c').innerHTML = '<option value="">Todos los cursos</option>' + cursos.map(c => '<option' + (c === antes ? ' selected' : '') + ' value="' + esc(c) + '">' + esc(c) + ' (' + cuenta(c) + ')</option>').join('');
  };
  const pg = crearPaginas(() => { pintar(); $('#ae-res').scrollIntoView({ block: 'start' }); });
  const pintar = () => {
    const q = $('#ae-q').value, f = $('#ae-f').value, e = $('#ae-e').value, c = $('#ae-c').value;
    const r = ls.filter(x => (!f || x.estado === f) && (!e || x.etapa === e) && (!c || x.curso === c) && (!q || coincide(x.nombre + ' ' + x.apellidos + ' ' + x.curso + ' ' + x.correo, q)));
    const conLibros = r.filter(x => x.libros).length, vis = pg.trozo(r);
    $('#ae-res').innerHTML = '<p class="suave peq" style="margin-bottom:0">' + r.length + ' lector(es)' + (conLibros ? ' · ' + conLibros + ' con libros ahora mismo' : '') + '</p>' + pg.html() + '<div class="tabla"><table><tr><th>Nombre</th><th>Curso</th><th class="ocultar-movil">Correo</th><th>Libros</th></tr>' +
      vis.map(x => '<tr class="clic" ' + on(() => editarLector(x)) + '><td>' + esc(x.apellidos ? x.apellidos + ', ' + x.nombre : x.nombre) + (x.estado !== 'Activo' ? ' <span class="etq Baja">baja</span>' : '') + '</td><td>' + esc(x.curso) + '</td><td class="ocultar-movil peq">' + esc(x.correo || '(sin correo)') + '</td><td>' + (x.libros || '') + '</td></tr>').join('') +
      '</table></div>' + pg.html();
  };
  let t; $('#ae-q').addEventListener('input', () => { clearTimeout(t); pg.reset(); t = setTimeout(pintar, 150); });
  $('#ae-e').addEventListener('change', () => { $('#ae-c').value = ''; rellenarCursos(); pg.reset(); pintar(); });
  $('#ae-c').addEventListener('change', () => { pg.reset(); pintar(); });
  $('#ae-f').addEventListener('change', () => { rellenarCursos(); pg.reset(); pintar(); });
  rellenarCursos();
  pintar();
}

async function editarLector(x) {
  const nuevo = !x;
  x = x || { nombre: '', apellidos: '', curso: '', correo: '', estado: 'Activo' };
  abrirVentana('<h2>' + (nuevo ? 'Nuevo lector' : esc(x.nombre + ' ' + x.apellidos)) + '</h2>' +
    (nuevo ? '<p class="peq suave">Para alumnado sin cuenta del colegio (por ejemplo, Infantil 3 años). Cuando tenga cuenta, añade aquí su correo.</p>' : '') +
    '<div class="rejilla"><div><label>Nombre *</label><input id="lx-nombre" value="' + esc(x.nombre) + '"></div><div><label>Apellidos</label><input id="lx-apellidos" value="' + esc(x.apellidos) + '"></div>' +
    '<div><label>Curso</label><input id="lx-curso" value="' + esc(x.curso) + '" placeholder="Ej.: Infantil 3 años"></div><div><label>Correo del colegio</label><input id="lx-correo" value="' + esc(x.correo) + '"></div>' +
    (nuevo ? '' : '<div><label>Estado</label><select id="lx-estado"><option' + (x.estado === 'Activo' ? ' selected' : '') + '>Activo</option><option' + (x.estado === 'Baja' ? ' selected' : '') + '>Baja</option></select></div>') +
    '</div><div id="lx-msg"></div><div class="acciones"><button class="b" id="lx-g">Guardar</button></div><div id="lx-h"></div>');
  $('#lx-g').onclick = async () => {
    const d = { nombre: $('#lx-nombre').value, apellidos: $('#lx-apellidos').value, curso: $('#lx-curso').value, correo: $('#lx-correo').value, estado: $('#lx-estado') ? $('#lx-estado').value : 'Activo' };
    try { await conBoton($('#lx-g'), () => api('guardarLector', nuevo ? null : x.id, d)); S.lectores = null; cerrarVentana(); aviso('Guardado'); vistaAdmin(); }
    catch (e) { $('#lx-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if (!nuevo) {
    try {
      const h = await api('historialLector', x.id);
      $('#lx-h').innerHTML = '<h3>Libros que ha sacado</h3>' + (h.length ? '<div class="tabla"><table><tr><th>Libro</th><th>Prestado</th><th>Devuelto</th></tr>' + h.map(p => '<tr><td>' + esc(p.titulo) + '<div class="peq suave">' + esc(p.codigo) + '</div></td><td>' + fecha(p.desde) + '</td><td>' + (p.devuelto ? fecha(p.devuelto) : '<span class="etq Prestado">Lo tiene</span>') + '</td></tr>').join('') + '</table></div>' : '<p class="suave">Todavía no ha sacado ningún libro.</p>');
    } catch (e) {}
  }
}

function importarListado() {
  abrirVentana('<h2>Importar el listado del alumnado</h2>' +
    '<p class="peq">Descarga los usuarios desde la consola de administración de Google (el archivo <i>Usuarios.xlsx</i> o un .csv) y <b>arrástralo aquí</b> o elígelo con el botón.</p>' +
    '<label id="im-zona" class="zona"><input type="file" id="im-f" accept=".xlsx,.xls,.csv" hidden><b>Arrastra aquí el archivo</b><br><span class="peq suave">o pulsa para elegirlo</span></label>' +
    '<div id="im-leido"></div>' +
    '<details class="peq" style="margin-top:12px"><summary>Para pocos alumnos: pegar filas copiadas de Excel</summary><textarea id="im-t" style="min-height:110px;margin-top:8px" placeholder="Pega aquí las filas (con la fila de títulos)…"></textarea></details>' +
    '<p class="peq suave">Las cuentas nuevas se dan de alta, las existentes se actualizan de curso y las que estén en un grupo «Baja» o suspendidas pasan a baja (sin perder su historial). El profesorado no se importa.</p>' +
    '<div id="im-msg"></div><div class="acciones"><button class="b" id="im-b">Importar</button></div>');
  let texto = '';
  const zona = $('#im-zona'), f = $('#im-f');
  const leer = async archivo => {
    if (!archivo) return;
    $('#im-leido').innerHTML = '<p class="cargando">Leyendo ' + esc(archivo.name) + '…</p>';
    try {
      texto = await archivoATexto(archivo);
      const filas = texto.split('\n').filter(l => l.trim()).length - 1;
      $('#im-leido').innerHTML = msg('ok', '✓ <b>' + esc(archivo.name) + '</b>: ' + filas + ' cuentas leídas. Pulsa <b>Importar</b>.');
    } catch (e) { texto = ''; $('#im-leido').innerHTML = msg('error', 'No he podido leer el archivo: ' + esc(textoError(e))); }
  };
  f.addEventListener('change', () => leer(f.files[0]));
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('encima'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('encima'); }));
  zona.addEventListener('drop', e => leer(e.dataTransfer.files[0]));
  $('#im-b').onclick = async () => {
    const datos = texto || $('#im-t').value;
    if (!datos.trim()) { $('#im-msg').innerHTML = msg('aviso', 'Primero elige el archivo (o pega las filas).'); return; }
    try {
      const r = await conBoton($('#im-b'), () => api('importarUsuarios', datos));
      S.lectores = null;
      $('#contenido').innerHTML = '<h2>Listado importado</h2>' + msg('ok', '<b>' + r.nuevos + '</b> altas nuevas · <b>' + r.actualizados + '</b> actualizados · <b>' + r.bajas + '</b> pasan a baja · ' + r.ignorados + ' cuentas ignoradas (profesorado, etc.)') +
        (r.pendientes.length ? '<h3>⚠ Alumnado dado de baja que aún tiene libros</h3><div class="tabla"><table><tr><th>Alumno/a</th><th>Libro</th></tr>' + r.pendientes.map(p => '<tr><td>' + esc(p.nombre) + '<div class="peq suave">' + esc(p.curso) + '</div></td><td>' + esc(p.titulo) + '<div class="peq suave">' + esc(p.codigo) + '</div></td></tr>').join('') + '</table></div>' : '') +
        '<div class="acciones"><button class="b" ' + on(() => { cerrarVentana(); vistaAdmin(); }) + '>Cerrar</button></div>';
    } catch (e) { $('#im-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
}

/** Convierte un .xlsx/.csv en texto separado por tabuladores (lo que espera el servidor). */
function cargarLectorExcel() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, mal) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = () => mal(new Error('no se ha podido cargar el lector de Excel; comprueba la conexión'));
    document.head.appendChild(sc);
  });
}
async function archivoATexto(archivo) {
  await cargarLectorExcel();
  const libro = XLSX.read(await archivo.arrayBuffer(), { type: 'array' });
  const hoja = libro.Sheets[libro.SheetNames[0]];
  return XLSX.utils.sheet_to_csv(hoja, { FS: '\t', blankrows: false });
}

window.addEventListener('appinstalled', () => { S.instalar = null; refrescarCabecera(); aviso('¡App instalada!'); });
function refrescarCabecera() { if (S.info) montar(false); }
async function instalarApp() {
