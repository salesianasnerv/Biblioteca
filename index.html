<style>
  /* Paleta corporativa (igual que el resto de webs del colegio) */
  :root {
    --azul: #009abb; --azul-oscuro: #007791; --verde: #b4be00; --verde-oscuro: #6b7200; --naranja: #ee712a;
    --fondo: #F8FAFC; --tarjeta: #FFFFFF; --texto: #1E293B; --suave: #64748B; --linea: #E2E8F0; --campo: #CBD5E1;
    --primario: var(--azul); --primario-claro: rgba(0, 154, 187, .11);
    --ok: #4d7c0f; --ok-claro: rgba(180, 190, 0, .18); --aviso: #b45309; --aviso-claro: rgba(238, 113, 42, .14);
    --error: #b42318; --error-claro: #fde8e6; --radio: 14px; --sombra: 0 10px 25px -5px rgba(0, 154, 187, .10), 0 8px 10px -6px rgba(0, 0, 0, .04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #0F1720; --tarjeta: #17212C; --texto: #E7ECF2; --suave: #93A2B3; --linea: #263340; --campo: #33424f;
      --azul: #29b6d4; --primario-claro: rgba(41, 182, 212, .14); --ok: #cdd640; --ok-claro: rgba(180, 190, 0, .15);
      --aviso: #f59e5b; --error: #f87171; --error-claro: rgba(248, 113, 113, .14); --sombra: 0 10px 25px -8px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fondo: #0F1720; --tarjeta: #17212C; --texto: #E7ECF2; --suave: #93A2B3; --linea: #263340; --campo: #33424f;
    --azul: #29b6d4; --primario-claro: rgba(41, 182, 212, .14); --ok: #cdd640; --ok-claro: rgba(180, 190, 0, .15);
    --aviso: #f59e5b; --error: #f87171; --error-claro: rgba(248, 113, 113, .14); --sombra: 0 10px 25px -8px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  button, input, select, textarea { font-family: inherit; }
  h1, h2, h3 { font-family: "Fira Sans", system-ui, sans-serif; }
  body { margin: 0; font: 15px/1.5 "Fira Sans", system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
  header { background: var(--tarjeta); border-bottom: 2px solid #009abb; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .marca .logo { height: 40px; width: auto; display: block; flex: none; }
  .marca h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--azul); padding-left: 14px; border-left: 1px solid var(--linea); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .quien { font-size: 13px; color: var(--suave); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  header .quien a { color: var(--azul); font-weight: 600; text-decoration: none; white-space: nowrap; }
  header .quien a:hover { text-decoration: underline; }
  .lg0 { fill: #b4be00; } .lg1 { fill: #cfd150; } .lg2 { fill: #009abb; } .lg3 { fill: #dedd83; }
  nav { background: var(--tarjeta); border-bottom: 1px solid var(--linea); display: flex; gap: 2px; flex-wrap: wrap; padding: 0 8px; position: sticky; top: 0; z-index: 8; }
  .menu-g { position: relative; }
  .menu-g > button::after { content: ""; display: inline-block; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: 0 0 3px 8px; opacity: .7; }
  .desplegable { display: none; position: absolute; top: 100%; left: 0; min-width: 230px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; box-shadow: var(--sombra), 0 12px 30px -10px rgba(0,0,0,.18); padding: 6px; z-index: 9; }
  .menu-g.abierto .desplegable { display: block; }
  @media (hover: hover) { .menu-g:hover .desplegable { display: block; } }
  .desplegable button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font: inherit; color: var(--texto); }
  .desplegable button:hover, .desplegable button.activo { background: var(--primario-claro); color: var(--azul); }
  .desplegable svg { width: 19px; height: 19px; color: var(--c, var(--azul)); flex: none; }
  @media (max-width: 600px) { nav > button, .menu-g > button { padding: 12px 10px; font-size: 14px; } .menu-g:last-child .desplegable { left: auto; right: 0; } }
  nav > button, .menu-g > button { font: inherit; border: 0; background: none; padding: 13px 14px; font-size: 15px; color: var(--suave); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav > button.activo, .menu-g > button.activo { color: var(--azul); border-bottom-color: var(--verde); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  h2 { font-size: 20px; margin: 6px 0 14px; color: var(--azul); display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--verde); flex: none; }
  #ventana h2::before { display: none; }
  h3 { font-size: 16px; margin: 20px 0 10px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: var(--radio); padding: 16px; margin-bottom: 14px; box-shadow: var(--sombra); }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .fila > .crece { flex: 1 1 220px; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--campo); border-radius: 8px; background: var(--tarjeta); color: var(--texto); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primario-claro); border-color: var(--primario); }
  input.grande { font-size: 20px; padding: 12px 14px; letter-spacing: .5px; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=checkbox] { width: auto; }
  button.b { font: inherit; border: 1px solid var(--primario); background: var(--primario); color: #fff; padding: 9px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  button.b:hover { filter: brightness(1.08); }
  button.b.sec { background: var(--tarjeta); color: var(--primario); }
  button.b.peligro { background: var(--tarjeta); color: var(--error); border-color: var(--error); }
  button.b.ok { background: var(--ok); border-color: var(--ok); }
  button.b.peq { padding: 5px 10px; font-size: 13px; }
  button.b:disabled { opacity: .5; cursor: default; }
  .etq { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--linea); color: var(--suave); white-space: nowrap; }
  .etq.Disponible { background: var(--ok-claro); color: var(--ok); }
  .etq.Prestado { background: var(--error-claro); color: var(--error); }
  .etq.Reservado { background: var(--aviso-claro); color: var(--aviso); }
  .etq.Baja { background: #e9e9e9; color: #666; text-decoration: line-through; }
  .etq.aviso { background: var(--aviso-claro); color: var(--aviso); }
  .suave { color: var(--suave); }
  .peq { font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--tarjeta); }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--suave); font-weight: 600; }
  tr.clic { cursor: pointer; }
  tr.clic:hover td { background: var(--primario-claro); }
  .tabla { overflow-x: auto; border: 1px solid var(--linea); border-radius: var(--radio); }
  .libro { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--linea); }
  .libro:last-child { border-bottom: 0; }
  .libro .t { font-weight: 600; }
  .ejemplares { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .lista-res { border: 1px solid var(--linea); border-radius: 8px; margin-top: 4px; max-height: 260px; overflow-y: auto; background: var(--tarjeta); }
  .lista-res div { padding: 9px 11px; cursor: pointer; border-bottom: 1px solid var(--linea); }
  .lista-res div:hover, .lista-res div.sel { background: var(--primario-claro); }
  .elegido { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--primario-claro); border-radius: 8px; padding: 11px 13px; }
  .msg { padding: 11px 13px; border-radius: 8px; margin: 8px 0; }
  .msg.ok { background: var(--ok-claro); color: var(--ok); }
  .msg.error { background: var(--error-claro); color: var(--error); }
  .msg.aviso { background: var(--aviso-claro); color: var(--aviso); }
  .msg.info { background: var(--primario-claro); color: var(--primario); }
  .subnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .subnav button { font: inherit; border: 1px solid var(--linea); background: var(--tarjeta); padding: 7px 13px; border-radius: 99px; cursor: pointer; }
  .subnav button.activo { background: var(--primario); color: #fff; border-color: var(--primario); }
  #velo { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: none; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 20; }
  #velo.abierto { display: flex; }
  #ventana { background: var(--tarjeta); border-radius: 12px; width: 100%; max-width: 620px; padding: 20px; position: relative; }
  #ventana .cerrar { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--suave); }
  #aviso-flot { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 11px 18px; border-radius: 8px; display: none; z-index: 30; max-width: 90vw; }
  .cargando { color: var(--suave); padding: 20px 0; }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .rejilla .ancho { grid-column: 1 / -1; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .qr-vista { text-align: center; }
  .qr-vista img { max-width: 100%; border: 1px solid var(--linea); border-radius: 8px; }
  #imprimir { display: none; }
  /* Pantalla de acceso */
  .acceso { min-height: calc(100vh - 160px); display: grid; place-items: center; padding: 20px 0; }
  .acceso .caja { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 18px; box-shadow: var(--sombra); padding: 34px 28px; max-width: 420px; width: 100%; text-align: center; }
  .acceso .logo-g { height: 64px; margin-bottom: 14px; }
  .acceso h2 { justify-content: center; font-size: 26px; margin: 0 0 6px; }
  .acceso h2::before { display: none; }
  .acceso p { color: var(--suave); margin: 0 0 22px; }
  #boton-google { display: flex; justify-content: center; min-height: 44px; }
  .acceso .nota { font-size: 13px; margin: 18px 0 0; }
  /* Panel de inicio */
  .saludo { margin: 6px 0 18px; }
  .saludo h2 { font-size: 26px; margin: 0; }
  .saludo h2::before { display: none; }
  .saludo p { margin: 2px 0 0; color: var(--suave); text-transform: capitalize; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .cifra { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 14px; text-align: left; font: inherit; color: inherit; }
  button.cifra { cursor: pointer; }
  button.cifra:hover { border-color: var(--azul); }
  .cifra b { display: block; font-size: 28px; line-height: 1.1; color: var(--azul); font-weight: 700; }
  .cifra span { font-size: 13px; color: var(--suave); }
  .cifra.alerta b { color: var(--error); }
  .cifra.alerta { border-color: var(--error); background: var(--error-claro); }
  .mosaico { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .losa { position: relative; display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 18px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: var(--radio); cursor: pointer; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .losa:hover { border-color: var(--c); box-shadow: var(--sombra); transform: translateY(-2px); }
  .losa .ico { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .losa .ico svg { width: 26px; height: 26px; }
  .losa b { display: block; font-size: 17px; margin-bottom: 2px; }
  .losa small { color: var(--suave); font-size: 13px; line-height: 1.35; display: block; }
  .losa .insignia { position: absolute; top: 12px; right: 12px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 8px; }
  .losa.peq-l { padding: 13px 16px; align-items: center; }
  .losa.peq-l .ico { width: 38px; height: 38px; border-radius: 10px; }
  .losa.peq-l .ico svg { width: 21px; height: 21px; }
  .losa.peq-l b { font-size: 15px; margin: 0; }
  .nivel { margin-bottom: 8px; }
  .cuadros { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 14px; }
  button.b svg { width: 17px; height: 17px; vertical-align: -3px; margin-right: 2px; }
  .nivel-t { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--suave); margin: 0 0 10px; }
  .nivel-t::before { content: ""; width: 5px; height: 16px; border-radius: 3px; background: var(--c); }
  .losa.peq-l small { margin-top: 1px; }
  .banda-previa { background: var(--aviso-claro); color: var(--aviso); border-bottom: 1px solid var(--linea); padding: 9px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 14px; }
  .titulo-sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0 10px; }
  .titulo-sec h3 { margin: 0; }
  /* Estantería */
  .vistas { display: inline-flex; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; }
  .vistas button { font: inherit; border: 0; background: var(--tarjeta); color: var(--suave); padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .vistas button.activo { background: var(--primario-claro); color: var(--azul); font-weight: 600; }
  .vistas svg { width: 18px; height: 18px; }
  .estante { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); row-gap: 26px; column-gap: 0; padding: 4px 0 6px; }
  .hueco { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 9px 0; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
  .hueco::after { content: ""; display: block; width: 100%; height: 10px; margin-top: -2px; background: linear-gradient(var(--balda, #c79a63), color-mix(in srgb, var(--balda, #a67845) 72%, #000)); box-shadow: 0 6px 8px -4px rgba(0,0,0,.35); order: 2; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--suave); margin: 0 4px 16px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 22px; height: 8px; border-radius: 2px; background: var(--c); display: inline-block; }
  .hueco .portada { order: 1; transition: transform .15s; }
  .hueco:hover .portada { transform: translateY(-5px) rotate(-1deg); }
  .hueco-t { order: 3; font-size: 12.5px; line-height: 1.25; margin-top: 8px; max-height: 2.5em; overflow: hidden; color: var(--texto); padding: 0 2px; }
  .portada { position: relative; display: block; width: 96px; aspect-ratio: 2 / 3; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: 2px 3px 8px rgba(0,0,0,.25); background: var(--c, #64748B); flex: none; }
  .portada.mini { width: 46px; border-radius: 2px 4px 4px 2px; }
  .portada.grande { width: 150px; }
  .portada img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .portada.falla img { display: none; }
  .portada .gen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10% 9% 10% 16%; color: #fff; text-align: left;
    background: linear-gradient(90deg, rgba(0,0,0,.28) 0 7%, rgba(255,255,255,.18) 7% 8.5%, transparent 8.5%), linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c)); }
  .portada .gen .gt { font-weight: 700; font-size: 12px; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .portada .gen .ga { font-size: 9.5px; opacity: .9; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .portada.mini .gen { padding: 8% 6% 8% 14%; }
  .portada.mini .gen .gt { font-size: 6px; -webkit-line-clamp: 5; }
  .portada.mini .gen .ga { display: none; }
  .portada.grande .gen .gt { font-size: 17px; }
  .portada.grande .gen .ga { font-size: 12px; }
  .portada .punto { position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); z-index: 2; }
  .portada .punto.si { background: #65a30d; }
  .portada .punto.no { background: #dc2626; }
  .portada.mini .punto { display: none; }
  .libro { align-items: flex-start; }
  .libro .izq { display: flex; gap: 12px; align-items: flex-start; }
  .sinopsis { white-space: pre-line; font-size: 14px; line-height: 1.55; max-height: 240px; overflow-y: auto; margin: 6px 0 12px; padding-right: 6px; }
  .ficha-g { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .ficha-g > div { flex: 1 1 240px; }
  .ficha-g h2 { margin-top: 0; }
  .zona { display: block; border: 2px dashed var(--campo); border-radius: var(--radio); padding: 26px 16px; text-align: center; cursor: pointer; margin: 10px 0 4px; color: var(--azul); }
  .zona:hover, .zona.encima { border-color: var(--azul); background: var(--primario-claro); }
  @media (max-width: 600px) {
    .rejilla { grid-template-columns: 1fr; }
    .ocultar-movil { display: none; }
    main { padding: 14px 12px 60px; }
  }
  @media print {
    body > *:not(#imprimir) { display: none !important; }
    #imprimir { display: block !important; }
    body { background: #fff; }
    .etiquetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .etiqueta { border: 1px dashed #bbb; border-left: 2mm solid var(--c); padding: 2.5mm 3mm; display: flex; gap: 3mm; align-items: center; break-inside: avoid; height: 32mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .etiqueta img { width: 26mm; height: 26mm; flex: none; }
    .etiqueta .txt { min-width: 0; display: flex; flex-direction: column; height: 100%; justify-content: center; }
    .etiqueta .c { font-weight: 800; font-size: 10.5pt; white-space: nowrap; color: #1E293B; }
    .etiqueta .c.largo { font-size: 9pt; }

    .tejuelo .banda { color: #fff; font: 700 7pt 'Fira Sans', sans-serif; text-align: center; padding: 1.5mm 0; letter-spacing: .3px; }
    .tejuelo .num { flex: 1; display: flex; align-items: center; justify-content: center; font: 800 20pt 'Fira Sans', sans-serif; color: #111; }
    .tejuelo .pie { font: 6pt sans-serif; text-align: center; color: #444; padding-bottom: 1mm; }
  }
  .tejuelo, .tejuelo .banda { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .muestra-tej .banda { color: #fff; font: 700 12px 'Fira Sans', sans-serif; text-align: center; padding: 6px 0; }
  .muestra-tej .num { flex: 1; display: flex; align-items: center; justify-content: center; font: 800 34px 'Fira Sans', sans-serif; color: #111; background: #fff; }

<script>
// ═════════════════════ Utilidades ═════════════════════
const S = { info: null, catalogo: null, lectores: null, pestana: null, sub: 'libros' };
const FN = [];
function on(fn) { FN.push(fn); return 'data-fn="' + (FN.length - 1) + '"'; }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-fn]');
  if (t && t.tagName !== 'INPUT' && t.tagName !== 'SELECT') FN[t.dataset.fn](e, t);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrarVentana(); cerrarMenus(); }
});

// ═════════════════════ Conexión con el «motor» (Apps Script) y acceso con Google ═════════════════════
const CFG = window.CONFIG || {};
let PASE = null;   // ID token de Google de quien ha entrado

function leerPase() { try { const t = localStorage.getItem('pase'); return t && caducidad(t) > Date.now() + 60000 ? t : null; } catch (e) { return null; } }
function guardarPase(t) { PASE = t; try { t ? localStorage.setItem('pase', t) : localStorage.removeItem('pase'); } catch (e) {} }
function caducidad(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }

let esperandoPase = null;
/** Pide a Google un pase nuevo sin molestar (si ya se había entrado antes) o muestra el botón. */
function renovarPase() {
  if (esperandoPase) return esperandoPase;
  esperandoPase = new Promise(ok => {
    const fin = t => { esperandoPase = null; ok(t); };
    S.alEntrar = t => fin(t);
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.prompt(n => { if (n.isNotDisplayed && n.isNotDisplayed() || n.isSkippedMoment && n.isSkippedMoment()) { S.alEntrar = null; fin(null); } });
    } else fin(null);
    setTimeout(() => { if (esperandoPase) { S.alEntrar = null; fin(null); } }, 12000);
  });
  return esperandoPase;
}

async function api(fn, ...args) {
  // Sin pase se consulta como visitante (solo el catálogo). Si el pase va a caducar, se renueva sin molestar.
  if (PASE && !CFG.paseDePrueba && caducidad(PASE) < Date.now() + 60000) {
    const nuevo = await renovarPase();
    if (nuevo) guardarPase(nuevo);
    else { guardarPase(null); if (S.info && S.info.rol !== 'visitante') { mostrarAcceso('Tu sesión ha caducado. Vuelve a entrar.'); throw new Error('Tienes que volver a entrar.'); } }
  }
  let r;
  try {
    r = await fetch(CFG.motor, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, token: PASE }) });
  } catch (e) { throw new Error('No hay conexión con la biblioteca. Comprueba Internet e inténtalo de nuevo.'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('La biblioteca no responde bien ahora mismo. Inténtalo en un momento.'); }
  if (!j.ok) {
    if (j.auth) { guardarPase(null); mostrarAcceso(j.error); }
    throw new Error(j.error);
  }
  return j.r;
}

function alRecibirPase(resp) {
  const t = resp && resp.credential;
  if (!t) return;
  guardarPase(t);
  if (S.alEntrar) { const f = S.alEntrar; S.alEntrar = null; f(t); return; }
  cambiosHechos(); S.vistaPrevia = false;
  arrancar();
}

function prepararGoogle() {
  return new Promise(ok => {
    const listo = () => {
      google.accounts.id.initialize({ client_id: CFG.idCliente, callback: alRecibirPase, auto_select: true, hd: CFG.dominio, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      ok();
    };
    if (window.google && google.accounts && google.accounts.id) return listo();
    let n = 0;
    const t = setInterval(() => { if (window.google && google.accounts && google.accounts.id) { clearInterval(t); listo(); } else if (++n > 100) { clearInterval(t); ok(); } }, 100);
  });
}

function mostrarAcceso(aviso) {
  S.info = null;
  $('#pestanas').innerHTML = ''; $('#banda').innerHTML = ''; $('#quien').innerHTML = '';
  cerrarVentana();
  $('#app').innerHTML = '<div class="acceso"><div class="caja"><img class="logo-g" src="icon-192.png" alt=""><h2>Biblioteca</h2>' +
    '<p>Entra con tu cuenta del colegio<br><b>@' + esc(CFG.dominio || 'nervion.salesianas.org') + '</b></p>' +
    (aviso ? msg('aviso', esc(aviso)) : '') + '<div id="boton-google"></div>' +
    '<p class="nota suave">Para reservar libros y para gestionar la biblioteca. Solo alumnado y profesorado de las Escuelas Salesianas María Auxiliadora.</p>' +
    '<p style="margin:16px 0 0"><button class="b sec" ' + on(() => arrancar()) + '>Ver el catálogo sin entrar</button></p></div></div>';
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.renderButton($('#boton-google'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'es', width: 280 });
    google.accounts.id.prompt();
  } else $('#boton-google').innerHTML = msg('error', 'No se ha podido cargar el acceso de Google. Recarga la página.');
}

async function salir() {
  if (!await confirmar('¿Cerrar la sesión de la biblioteca en este dispositivo?', 'Cerrar sesión')) return;
  guardarPase(null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  S.catalogo = null; S.lectores = null; S.vistaPrevia = false;
  await arrancar();
  aviso('Has cerrado la sesión.');
}
function textoError(e) { return String((e && e.message) || e).replace(/^(Exception|Error):\s*/, ''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fecha(s) { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ]+/g, ' ').trim(); }
function coincide(texto, q) { const t = norm(texto); return norm(q).split(' ').every(p => t.includes(p)); }
function $(sel, raiz) { return (raiz || document).querySelector(sel); }
function aviso(txt) { const a = $('#aviso-flot'); a.textContent = txt; a.style.display = 'block'; clearTimeout(a._t); a._t = setTimeout(() => a.style.display = 'none', 3500); }
function msg(tipo, html) { return '<div class="msg ' + tipo + '">' + html + '</div>'; }
function etiqueta(estado) { return '<span class="etq ' + esc(estado) + '">' + esc(estado) + '</span>'; }
function esGestor() { return S.info && S.info.rol === 'gestor'; }

const ICONOS = {
  inicio: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  prestar: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M12 13V7m-3 3 3-3 3 3"/>',
  devolver: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M12 7v6m-3-3 3 3 3-3"/>',

  estanteria: '<rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="m15 5 4-1 3 15-4 1z"/>',
  lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  editar: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  personas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
  ajustes: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  historial: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  escudo: '<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16a4 4 0 0 1 8 0"/>',
  marcador: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  buscar: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'
};
function ico(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS[n] || '') + '</svg>'; }
function losa(color, icono, titulo, texto, accion, insignia, peq) {
  return '<button class="losa' + (peq ? ' peq-l' : '') + '" style="--c:' + color + '" ' + on(accion) + '><span class="ico">' + ico(icono) + '</span><span><b>' + titulo + '</b>' + (texto ? '<small>' + texto + '</small>' : '') + '</span>' +
    (insignia ? '<span class="insignia">' + insignia + '</span>' : '') + '</button>';
}
function irAdmin(sub, filtro) { S.sub = sub; S.filtroLibros = filtro || ''; ir('admin'); }

// ───── Portadas ─────
const COLOR_PORTADA = { 'Infantil': '#ee712a', 'Primaria': '#8a9400', 'ESO/Bachillerato': '#007791' };
function disponibles(g) { return g.ejemplares.filter(x => x.estado === 'Disponible').length; }
function portadaHtml(g, tam) {
  const c = COLOR_PORTADA[g.etapa] || '#64748B';
  const disp = disponibles(g);
  return '<span class="portada ' + (tam || '') + '" style="--c:' + c + '">' +
    '<span class="gen"><span class="gt">' + esc(g.titulo) + '</span><span class="ga">' + esc(g.autor) + '</span></span>' +
    (g.portada ? '<img src="' + esc(g.portada) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') +
    '<span class="punto ' + (disp ? 'si' : 'no') + '" title="' + (disp ? 'Disponible' : 'No disponible') + '"></span></span>';
}
// Si una portada no carga, o es la imagen genérica de «sin portada», se ve la portada dibujada.
document.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.parentNode.classList.contains('portada')) e.target.parentNode.classList.add('falla'); }, true);
document.addEventListener('load', e => { const t = e.target; if (t.tagName === 'IMG' && t.parentNode.classList.contains('portada') && t.naturalWidth < 60) t.parentNode.classList.add('falla'); }, true);
function leyendaEtapas() {
  return '<div class="leyenda">' + Object.keys(COLOR_PORTADA).map(e => '<span style="--c:' + COLOR_PORTADA[e] + '"><i></i>' + e + '</span>').join('') +
    '<span><i style="background:#65a30d;width:10px;height:10px;border-radius:50%"></i>Disponible</span><span><i style="background:#dc2626;width:10px;height:10px;border-radius:50%"></i>Prestado</span></div>';
}
function estanteria(grupos) {
  return leyendaEtapas() + '<div class="estante">' + grupos.map(g => '<button class="hueco" style="--balda:' + (COLOR_PORTADA[g.etapa] || '#a67845') + '" title="' + esc(g.titulo) + '" ' + on(() => fichaGrupo(g)) + '>' + portadaHtml(g) + '<span class="hueco-t">' + esc(g.titulo) + '</span></button>').join('') + '</div>';
}
function leerPref(k, def) { try { return localStorage.getItem(k) || def; } catch (e) { return def; } }
function guardarPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function abrirVentana(html) { $('#contenido').innerHTML = html; $('#velo').classList.add('abierto'); const f = $('#contenido input:not([type=checkbox]), #contenido textarea'); if (f) setTimeout(() => f.focus(), 50); }
function cerrarVentana() { $('#velo').classList.remove('abierto'); $('#contenido').innerHTML = ''; }
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') cerrarVentana(); });

function confirmar(texto, boton) {
  return new Promise(ok => {
    abrirVentana('<h2>¿Seguro?</h2><p>' + texto + '</p><div class="acciones">' +
      '<button class="b" ' + on(() => { cerrarVentana(); ok(true); }) + '>' + esc(boton || 'Sí') + '</button>' +
      '<button class="b sec" ' + on(() => { cerrarVentana(); ok(false); }) + '>Cancelar</button></div>');
  });
}

async function conBoton(btn, tarea) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = 'Un momento…';
  try { return await tarea(); } finally { btn.disabled = false; btn.textContent = t; }
}

async function cargarCatalogo(forzar) {
  if (!S.catalogo || forzar) S.catalogo = await api('catalogo');
  if (!S.vistaPrevia) return S.catalogo;
  return S.catalogo.map(g => Object.assign({}, g, {
    ejemplares: g.ejemplares.filter(x => x.estado !== 'Baja').map(x => ({ codigo: x.codigo, titulo: x.titulo, autor: x.autor, etapa: x.etapa, estado: x.estado, vuelve: x.vuelve, portada: x.portada }))
  })).filter(g => g.ejemplares.length);
}
async function cargarLectores(forzar) {
  if (!S.lectores || forzar) S.lectores = await api('lectoresActivos');
  return S.lectores;
}
function cambiosHechos() { S.catalogo = null; S.lectores = null; }

// ═════════════════════ Arranque ═════════════════════
async function iniciar() {
  await prepararGoogle();
  PASE = (CFG.paseDePrueba) || leerPase();
  arrancar();   // sin pase: vista pública del catálogo
}

async function arrancar() {
  $('#app').innerHTML = '<div class="cargando">Cargando…</div>';
  try {
    S.info = await api('iniciar');
  } catch (e) {
    if (S.info === null && !PASE && $('.acceso')) return;   // ya se está mostrando la pantalla de acceso
    $('#app').innerHTML = msg('error', 'No se ha podido abrir la biblioteca: ' + esc(textoError(e)));
    return;
  }
  montar();
  // ¿Se ha abierto escaneando el QR de un libro?
  // Si se ha escaneado sin haber entrado, se recuerda para abrirlo también después de entrar.
  const libro = new URLSearchParams(location.search).get('libro') || S.libroPendiente;
  if (libro) {
    S.libroPendiente = S.info.rol === 'visitante' && !PASE ? libro : null;
    if (location.search) history.replaceState(null, '', location.pathname);
    fichaLibro(libro);
  }
}

/** Pinta cabecera y pestañas según el papel (gestión, alumnado o visitante). */
function montar(navegar) {
  const i = S.info;
  $('#titulo').textContent = i.ajustes.nombre_biblioteca;
  document.title = i.ajustes.nombre_biblioteca;
  const quien = i.rol === 'gestor' ? i.correo + ' · Gestión' : i.rol === 'lector' ? i.nombre + ' · ' + i.curso
    : i.correo ? i.correo + ' · sin alta en la biblioteca' : '';
  $('#quien').innerHTML = '<span>' + esc(quien) + '</span>' +
    (S.instalar ? '<a href="#" ' + on(e => { e.preventDefault(); instalarApp(); }) + '>Instalar app</a>' : '') +
    (i.rol === 'gestor' ? '<a href="#" ' + on(e => { e.preventDefault(); verComoAlumno(true); }) + '>Ver como alumno</a>' : '') +
    (PASE ? '<a href="#" ' + on(e => { e.preventDefault(); salir(); }) + '>Cerrar sesión</a>'
      : '<button class="b peq" ' + on(() => mostrarAcceso()) + '>Entrar</button>');
  const pest = i.rol === 'gestor'
    ? [['inicio', 'Inicio'], ['prestar', 'Prestar'], ['devolver', 'Devolver'], ['prestamos', 'En préstamo'], ['catalogo', 'Catálogo'], ['admin', 'Administración']]
    : i.rol === 'lector' ? [['inicio', 'Inicio'], ['catalogo', 'Catálogo'], ['mis', 'Mis libros']] : [['inicio', 'Inicio'], ['catalogo', 'Catálogo']];
  if (i.rol === 'gestor') {

    const grupos = [
      ['g-prest', 'Préstamos', [['prestar', 'Prestar', AZ, () => ir('prestar')], ['devolver', 'Devolver', VE, () => ir('devolver')], ['reloj', 'En préstamo', NA, () => ir('prestamos')]]],
      ['g-cat', 'Catálogo', [['estanteria', 'Catálogo', '#007791', () => ir('catalogo')], ['editar', 'Libros', AZ, () => irAdmin('libros')], ['qr', 'Etiquetas y tejuelos', NA, () => irAdmin('libros', 'tejuelo')]]],
      ['g-adm', 'Administración', [['personas', 'Alumnado', VE, () => irAdmin('lectores')], ['escudo', 'Quién gestiona', GR, () => irAdmin('gestores')], ['ajustes', 'Ajustes', GR, () => irAdmin('ajustes')], ['historial', 'Historial', GR, () => irAdmin('historial')]]]
    ];
    $('#pestanas').innerHTML = '<button data-p="inicio" ' + on(() => ir('inicio')) + '>Inicio</button>' + grupos.map(g =>
      '<div class="menu-g" data-p="' + g[0] + '"><button aria-haspopup="true" ' + on((e, b) => { const m = b.parentNode, ab = !m.classList.contains('abierto'); cerrarMenus(); m.classList.toggle('abierto', ab); }) + '>' + g[1] + '</button>' +
      '<div class="desplegable">' + g[2].map(x => '<button style="--c:' + x[2] + '" ' + on(() => { cerrarMenus(); x[3](); }) + '>' + ico(x[0]) + x[1] + '</button>').join('') + '</div></div>').join('');
  } else {
    $('#pestanas').innerHTML = pest.map(p => '<button data-p="' + p[0] + '" ' + on(() => ir(p[0])) + '>' + p[1] + '</button>').join('');
  }
  $('#banda').innerHTML = S.vistaPrevia ? '<div class="banda-previa"><span><b>Vista del alumnado.</b> Así ven la web los alumnos (aquí no se reserva de verdad).</span>' +
    '<button class="b peq" ' + on(() => verComoAlumno(false)) + '>Volver a la gestión</button></div>' : '';
  if (navegar === false) marcarMenu(); else ir(pest[0][0]);
}

/** Quien gestiona puede ver la web tal y como la ve el alumnado. */
function verComoAlumno(si) {
  if (si && !S.vistaPrevia) {
    S.infoReal = S.info;
    S.info = Object.assign({}, S.info, { rol: 'lector', nombre: 'Alumno/a de ejemplo', curso: 'Vista previa' });
    S.vistaPrevia = true;
  } else if (!si && S.vistaPrevia) {
    S.info = S.infoReal;
    S.vistaPrevia = false;
  }
  cerrarVentana();
  montar();
}

function cerrarMenus() { document.querySelectorAll('.menu-g.abierto').forEach(m => m.classList.remove('abierto')); }
document.addEventListener('click', e => { if (!e.target.closest('.menu-g')) cerrarMenus(); });

/** Marca en el menú de arriba el grupo de la pantalla actual. */
function marcarMenu() {
  const p = S.pestana;
  const grupo = ['prestar', 'devolver', 'prestamos'].includes(p) ? 'g-prest'
    : (p === 'catalogo' || (p === 'admin' && S.sub === 'libros')) ? 'g-cat'
    : p === 'admin' ? 'g-adm' : p;
  document.querySelectorAll('#pestanas > [data-p]').forEach(b => {
    const activo = b.dataset.p === grupo || (b.dataset.p === 'catalogo' && grupo === 'g-cat');
    (b.classList.contains('menu-g') ? b.firstElementChild : b).classList.toggle('activo', activo);
  });
}

function ir(p) {
  S.pestana = p;
  cerrarMenus();
  marcarMenu();
  ({ inicio: vistaInicio, prestar: vistaPrestar, devolver: vistaDevolver, prestamos: vistaPrestamos, catalogo: vistaCatalogo, mis: vistaMisLibros, admin: vistaAdmin })[p]();
  window.scrollTo(0, 0);
}

// ═════════════════════ Selector de lector ═════════════════════
function selectorLector(contenedor, alElegir, placeholder) {
  contenedor.innerHTML = '<input class="sel-q" placeholder="' + esc(placeholder || 'Escribe nombre, apellidos o curso…') + '" autocomplete="off"><div class="lista-res sel-l" style="display:none"></div>';
  const q = $('.sel-q', contenedor), l = $('.sel-l', contenedor);
  let res = [], marcado = 0;
  const pintar = () => {
    l.style.display = res.length ? 'block' : 'none';
    l.innerHTML = res.map((x, i) => '<div class="' + (i === marcado ? 'sel' : '') + '" data-i="' + i + '"><b>' + esc(x.nombre) + '</b> <span class="suave">· ' + esc(x.curso) + (x.libros ? ' · ' + x.libros + ' libro(s)' : '') + '</span></div>').join('');
  };
  q.addEventListener('input', async () => {
    const lectores = await cargarLectores();
    const v = q.value.trim();
    res = v.length < 2 ? [] : lectores.filter(x => coincide(x.nombre + ' ' + x.curso + ' ' + x.correo, v)).slice(0, 30);
    marcado = 0; pintar();
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { marcado = Math.min(res.length - 1, marcado + 1); pintar(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { marcado = Math.max(0, marcado - 1); pintar(); e.preventDefault(); }
    if (e.key === 'Enter' && res[marcado]) { e.preventDefault(); alElegir(res[marcado]); }
  });
  l.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) alElegir(res[d.dataset.i]); });
  cargarLectores().catch(() => {});
  setTimeout(() => q.focus(), 30);
}

// ═════════════════════ Prestar ═════════════════════
function vistaPrestar() {
  const hechos = [];
  let lector = null;
  $('#app').innerHTML =
    '<h2>Prestar un libro</h2>' +
    '<div class="tarjeta"><label>1. ¿Quién se lo lleva?</label><div id="p-lector"></div></div>' +
    '<div class="tarjeta"><label>2. Código del libro <span class="suave">(escríbelo o escanea el QR / código de barras)</span></label>' +
    '<div class="fila"><input id="p-cod" class="grande crece" placeholder="Ej.: PRIMARIA-245" autocomplete="off"><button class="b" id="p-btn">Prestar</button></div>' +
    '<div id="p-libro"></div></div><div id="p-hechos"></div>';
  const cod = $('#p-cod'), info = $('#p-libro');

  const elegir = x => {
    lector = x;
    $('#p-lector').innerHTML = '<div class="elegido"><div><b>' + esc(x.nombre) + '</b> · ' + esc(x.curso) +
      '<div class="peq suave">' + x.libros + ' libro(s) en préstamo o reservados · máximo ' + S.info.ajustes.max_libros_alumno + '</div></div>' +
      '<button class="b sec peq" ' + on(() => { lector = null; selectorLector($('#p-lector'), elegir); }) + '>Cambiar</button></div>';
    cod.focus();
  };
  selectorLector($('#p-lector'), elegir);

  let tLibro;
  cod.addEventListener('input', () => {
    clearTimeout(tLibro);
    const v = cod.value.trim();
    if (v.length < 4) { info.innerHTML = ''; return; }
    tLibro = setTimeout(async () => {
      try { const l = await api('verLibro', v); if (cod.value.trim() === v) info.innerHTML = '<p>' + etiqueta(l.estado) + ' <b>' + esc(l.titulo) + '</b> <span class="suave">· ' + esc(l.autor) + '</span>' + (l.reserva ? '<br><span class="peq">Reservado para ' + esc(l.reserva.nombre) + '</span>' : '') + (l.prestamo ? '<br><span class="peq">Prestado a ' + esc(l.prestamo.nombre) + '</span>' : '') + '</p>'; }
      catch (e) { if (cod.value.trim() === v) info.innerHTML = '<p class="peq suave">' + esc(textoError(e)) + '</p>'; }
    }, 350);
  });

  const hacer = async (forzar) => {
    const v = cod.value.trim();
    if (!lector) { aviso('Primero elige quién se lo lleva.'); return; }
    if (!v) { cod.focus(); return; }
    const btn = $('#p-btn');
    try {
      const r = await conBoton(btn, () => api('prestar', v, lector.id, !!forzar));
      if (r.aviso) {
        if (await confirmar(esc(r.aviso) + '<br><br>¿Prestar igualmente?', 'Prestar igualmente')) return hacer(true);
        return;
      }
      lector.libros++;
      elegir(lector);
      hechos.unshift(r);
      cod.value = ''; info.innerHTML = '';
      cambiosHechos();
      $('#p-hechos').innerHTML = '<h3>Préstamos hechos ahora</h3>' + hechos.map(h => msg('ok', '✓ <b>' + esc(h.titulo) + '</b> (' + esc(h.codigo) + ') → ' + esc(h.nombre) + '. Devolver antes del <b>' + fecha(h.limite) + '</b>')).join('');
      aviso('Prestado a ' + r.nombre);
    } catch (e) { info.innerHTML = msg('error', esc(textoError(e))); }
  };
  $('#p-btn').onclick = () => hacer(false);
  cod.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); hacer(false); } });
}

// ═════════════════════ Devolver ═════════════════════
function vistaDevolver() {
  const hechos = [];
  $('#app').innerHTML = '<h2>Devolver un libro</h2><div class="tarjeta"><label>Código del libro (escríbelo o escanéalo y pulsa Intro)</label>' +

// ═════════════════════ En préstamo y reservas ═════════════════════
async function vistaPrestamos() {
  $('#app').innerHTML = '<h2>Libros en préstamo</h2><div class="cargando">Cargando…</div>';
  let d;
  try { d = await api('prestamosYReservas'); } catch (e) { $('#app').innerHTML = msg('error', esc(textoError(e))); return; }
  let filtro = '', soloRetraso = false;
  const pintar = () => {
    const ps = d.prestamos.filter(p => (!soloRetraso || p.retraso) && coincide(p.titulo + ' ' + p.codigo + ' ' + p.nombre + ' ' + p.curso, filtro));
    const rs = d.reservas.filter(r => coincide(r.titulo + ' ' + r.codigo + ' ' + r.nombre + ' ' + r.curso, filtro));
    const retrasados = d.prestamos.filter(p => p.retraso).length;
    $('#pr-lista').innerHTML =
      '<h3>Reservas pendientes de recoger (' + d.reservas.length + ')</h3>' +
      (rs.length ? '<div class="tabla"><table><tr><th>Libro</th><th>Para</th><th class="ocultar-movil">Recoger antes del</th><th></th></tr>' + rs.map(r =>
        '<tr><td><b>' + esc(r.titulo) + '</b><div class="peq suave">' + esc(r.codigo) + '</div></td><td>' + esc(r.nombre) + '<div class="peq suave">' + esc(r.curso) + '</div></td><td class="ocultar-movil">' + fecha(r.caduca) + '</td><td><div class="fila">' +
        '<button class="b ok peq" ' + on(async (e, b) => { try { await conBoton(b, () => api('prestar', r.codigo, r.lector, true)); cambiosHechos(); aviso('Entregado a ' + r.nombre); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>Entregar</button>' +
        '<button class="b peligro peq" ' + on(async (e, b) => { if (await confirmar('¿Cancelar la reserva de «' + esc(r.titulo) + '» para ' + esc(r.nombre) + '?', 'Cancelar reserva')) { try { await api('cancelarReserva', r.id); cambiosHechos(); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } } }) + '>Cancelar</button>' +
        '</div></td></tr>').join('') + '</table></div>' : '<p class="suave">No hay reservas pendientes.</p>') +
      '<h3>Préstamos (' + d.prestamos.length + (retrasados ? ', <span style="color:var(--error)">' + retrasados + ' con retraso</span>' : '') + ')</h3>' +
      (ps.length ? '<div class="tabla"><table><tr><th>Libro</th><th>Lector</th><th class="ocultar-movil">Prestado</th><th>Devolver antes del</th><th></th></tr>' + ps.map(p =>
        '<tr><td><b>' + esc(p.titulo) + '</b><div class="peq suave">' + esc(p.codigo) + '</div></td><td>' + esc(p.nombre) + '<div class="peq suave">' + esc(p.curso) + '</div></td><td class="ocultar-movil">' + fecha(p.desde) + '</td><td>' + fecha(p.limite) + (p.retraso ? '<br><span class="etq Prestado">' + p.retraso + ' días tarde</span>' : '') + '</td><td><div class="fila">' +
        '<button class="b peq" ' + on(async (e, b) => { try { await conBoton(b, () => api('devolver', p.codigo)); cambiosHechos(); aviso('Devuelto'); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>Devuelto</button>' +
        '<button class="b sec peq" ' + on(async (e, b) => { try { const f = await conBoton(b, () => api('renovar', p.id)); aviso('Renovado hasta el ' + fecha(f)); vistaPrestamos(); } catch (er) { aviso(textoError(er)); } }) + '>Renovar</button>' +
        '</div></td></tr>').join('') + '</table></div>' : '<p class="suave">' + (d.prestamos.length ? 'Ningún préstamo coincide con la búsqueda.' : 'No hay libros prestados.') + '</p>');
  };
  $('#app').innerHTML = '<h2>Libros en préstamo</h2><div class="fila"><input id="pr-q" class="crece" placeholder="Buscar por libro, alumno o curso…"><label class="fila" style="margin:0"><input type="checkbox" id="pr-r"> Solo con retraso</label></div><div id="pr-lista"></div>';
  $('#pr-q').addEventListener('input', e => { filtro = e.target.value; pintar(); });
  $('#pr-r').addEventListener('change', e => { soloRetraso = e.target.checked; pintar(); });
  pintar();
}

// ═════════════════════ Catálogo ═════════════════════
async function vistaCatalogo() {
  const i = S.info;
  $('#app').innerHTML = '<h2>Catálogo</h2>' +
    (i.rol === 'visitante' && !PASE ? msg('info', 'Para reservar un libro, <a href="#" ' + on(e => { e.preventDefault(); mostrarAcceso(); }) + '>entra con tu cuenta del colegio</a>.') : '') +
    '<div class="tarjeta"><div class="fila"><input id="c-q" class="crece" placeholder="Busca por título, autor, editorial…" autocomplete="off">' +
    '<select id="c-e" style="width:auto"><option value="">Todas las etapas</option>' + i.etapas.map(e => '<option>' + esc(e) + '</option>').join('') + '</select>' +
    '<label class="fila" style="margin:0"><input type="checkbox" id="c-d"> Solo disponibles</label>' +
    '<span class="vistas"><button id="v-l">' + ico('lista') + 'Lista</button><button id="v-e">' + ico('estanteria') + 'Estantería</button></span></div></div><div id="c-res" class="cargando">Cargando catálogo…</div>';
  let vista = leerPref('vista', 'lista');
  const marcarVista = () => { $('#v-l').classList.toggle('activo', vista === 'lista'); $('#v-e').classList.toggle('activo', vista === 'estanteria'); };
  marcarVista();
  let cat;
  try { cat = await cargarCatalogo(); } catch (e) { $('#c-res').innerHTML = msg('error', esc(textoError(e))); return; }
  let max = 40;
  const pintar = () => {
    const q = $('#c-q').value, et = $('#c-e').value, solo = $('#c-d').checked;
    const r = cat.filter(g => (!et || g.etapa === et) && (!solo || g.ejemplares.some(x => x.estado === 'Disponible')) &&
      (!q || coincide(g.titulo + ' ' + g.autor + ' ' + g.editorial + ' ' + g.genero + ' ' + g.ejemplares.map(x => x.codigo).join(' '), q)));
    const caja = $('#c-res'); caja.className = '';
    const cuerpo = !r.length ? '<p class="suave" style="padding:14px 0">No hay resultados.</p>'
      : vista === 'estanteria' ? estanteria(r.slice(0, max)) : r.slice(0, max).map(grupoCatalogo).join('');
    caja.innerHTML = '<p class="suave peq">' + r.length + ' título(s)</p><div class="tarjeta" style="padding:' + (vista === 'estanteria' ? '18px 10px' : '0 16px') + '">' + cuerpo + '</div>' +
      (r.length > max ? '<button class="b sec" ' + on(() => { max += 60; pintar(); }) + '>Ver más</button>' : '');
  };
  let t; ['#c-q', '#c-e', '#c-d'].forEach(s => $(s).addEventListener(s === '#c-q' ? 'input' : 'change', () => { clearTimeout(t); max = 40; t = setTimeout(pintar, 150); }));
  $('#v-l').onclick = () => { vista = 'lista'; guardarPref('vista', vista); marcarVista(); pintar(); };
  $('#v-e').onclick = () => { vista = 'estanteria'; guardarPref('vista', vista); marcarVista(); pintar(); };
  pintar();
  $('#c-q').focus();
}

function grupoCatalogo(g) {
  return '<div class="libro"><div class="izq"><span style="cursor:pointer" ' + on(() => fichaGrupo(g)) + '>' + portadaHtml(g, 'mini') + '</span><div><div class="t">' + esc(g.titulo) + '</div><div class="suave peq">' + esc(g.autor) + (g.editorial ? ' · ' + esc(g.editorial) : '') + '</div>' +
    '<div style="margin-top:4px">' + (g.etapa ? '<span class="etq">' + esc(g.etapa) + '</span> ' : '') + (g.genero ? '<span class="etq">' + esc(g.genero) + '</span>' : '') + '</div></div></div>' +
    '<div style="text-align:right;min-width:150px">' + accionesGrupo(g) + '</div></div>';
}

function fichaGrupo(g) {
  abrirVentana('<div class="ficha-g">' + portadaHtml(g, 'grande') + '<div><h2>' + esc(g.titulo) + '</h2><p class="suave">' + esc(g.autor) + (g.editorial ? ' · ' + esc(g.editorial) : '') + '</p>' +
    '<p>' + (g.etapa ? '<span class="etq">' + esc(g.etapa) + '</span> ' : '') + (g.genero ? '<span class="etq">' + esc(g.genero) + '</span>' : '') + '</p>' +
    '<div id="sinop"></div><div style="text-align:left">' + accionesGrupo(g).replace(/justify-content:flex-end/g, 'justify-content:flex-start').replace(/text-align:right/g, 'text-align:left') + '</div></div></div>');
  const codigos = g.ejemplares.map(x => x.codigo).filter(String);
  if (codigos.length) api('sinopsisDe', codigos).then(t => { const d = $('#sinop'); if (d && t) d.innerHTML = '<div class="sinopsis">' + esc(t) + '</div>'; }).catch(() => {});
}

function accionesGrupo(g) {
  const disp = g.ejemplares.filter(x => x.estado === 'Disponible').length;
  const total = g.ejemplares.filter(x => x.estado !== 'Baja').length;
  let derecha = '';
  if (esGestor()) {
    derecha = '<div class="ejemplares">' + g.ejemplares.map(x =>
      '<div class="fila" style="justify-content:flex-end"><span class="peq">' + esc(x.codigo || 'sin código') + '</span> ' + etiqueta(x.estado) +
      '<button class="b sec peq" ' + on(() => fichaLibro(x.codigo, x)) + '>Ficha</button></div>' +
      (x.prestamo ? '<div class="peq suave" style="text-align:right">' + esc(x.prestamo.nombre) + ' · hasta ' + fecha(x.prestamo.limite) + '</div>' : '') +
      (x.reserva ? '<div class="peq suave" style="text-align:right">Reservado: ' + esc(x.reserva.nombre) + '</div>' : '')).join('') + '</div>';
  } else {
    const vuelve = g.ejemplares.filter(x => x.vuelve).map(x => x.vuelve).sort()[0];
    derecha = disp ? '<span class="etq Disponible">' + disp + ' de ' + total + ' disponible' + (disp > 1 ? 's' : '') + '</span>'
      : '<span class="etq Prestado">No disponible</span>' + (vuelve ? '<div class="peq suave">Vuelve hacia el ' + fecha(vuelve) + '</div>' : '');
    if (S.info.rol === 'visitante' && !PASE && disp) {
      derecha += '<div style="margin-top:6px"><button class="b sec peq" ' + on(() => { cerrarVentana(); mostrarAcceso(); }) + '>Entra para reservar</button></div>';
    }
    if (S.info.rol === 'lector' && S.info.ajustes.reservas_alumnado && disp) {
      derecha += '<div style="margin-top:6px"><button class="b peq" ' + on((e, b) => { cerrarVentana(); reservarGrupo(g, b); }) + '>Reservar</button></div>';
    }
  }
  return derecha;
}

async function reservarGrupo(g, btn) {
  if (S.vistaPrevia) {
    abrirVentana('<h2>Vista previa</h2>' + msg('info', 'Aquí el alumno confirmaría la reserva de <b>' + esc(g.titulo) + '</b> y tendría ' + S.info.ajustes.dias_reserva + ' días para recogerlo. En la vista previa no se reserva de verdad.'));
    return;
  }
  if (!await confirmar('¿Reservar «' + esc(g.titulo) + '»? Tendrás ' + S.info.ajustes.dias_reserva + ' días para recogerlo en la biblioteca.', 'Reservar')) return;
  try {
    const r = await api('reservar', g.ejemplares.filter(x => x.estado === 'Disponible').map(x => x.codigo));
    cambiosHechos();
    abrirVentana('<h2>¡Reservado!</h2>' + msg('ok', 'Has reservado <b>' + esc(r.titulo) + '</b>.') + '<p>Pasa por la biblioteca a recogerlo antes del <b>' + fecha(r.caduca) + '</b>. Si no, la reserva se anulará.</p><div class="acciones"><button class="b" ' + on(() => { cerrarVentana(); ir('mis'); }) + '>Ver mis libros</button></div>');
  } catch (e) { abrirVentana('<h2>No se ha podido reservar</h2>' + msg('error', esc(textoError(e)))); }
  if (S.pestana === 'catalogo') vistaCatalogo();
  if (S.pestana === 'inicio') vistaInicio();
}

// ═════════════════════ Ficha de un libro (también al escanear el QR) ═════════════════════
async function fichaLibro(codigo) {
  abrirVentana('<div class="cargando">Buscando el libro…</div>');
  let l;
  try { l = await api('verLibro', codigo); if (S.vistaPrevia) { delete l.prestamo; delete l.reserva; delete l.revisar; delete l.observaciones; } } catch (e) { $('#contenido').innerHTML = '<h2>Libro</h2>' + msg('error', esc(textoError(e))); return; }
  let html = '<div class="ficha-g">' + portadaHtml({ titulo: l.titulo, autor: l.autor, etapa: l.etapa, portada: l.portada, ejemplares: [l] }, 'grande') + '<div><h2>' + esc(l.titulo) + '</h2><p class="suave">' + esc(l.autor) + (l.editorial ? ' · ' + esc(l.editorial) : '') + '</p>' +
    '<p>' + etiqueta(l.estado) + ' <span class="etq">' + esc(l.codigo) + '</span> ' + (l.etapa ? '<span class="etq">' + esc(l.etapa) + '</span>' : '') + '</p>' +
    (l.sinopsis ? '<div class="sinopsis">' + esc(l.sinopsis) + '</div>' : '') + '</div></div>';
  if (!esGestor()) {
    if (l.estado === 'Disponible' && S.info.rol === 'visitante' && !PASE) {
      html += '<div class="acciones"><button class="b" ' + on(() => { cerrarVentana(); mostrarAcceso(); }) + '>Entra para reservarlo</button></div>';
    } else if (l.estado === 'Disponible' && S.info.rol === 'lector' && S.info.ajustes.reservas_alumnado) {
      html += '<div class="acciones"><button class="b" ' + on((e, b) => { cerrarVentana(); reservarGrupo({ titulo: l.titulo, ejemplares: [l] }, b); }) + '>Reservar este libro</button></div>';
    } else if (l.estado !== 'Disponible') {
      html += '<p>Ahora mismo no está disponible' + (l.vuelve ? '; debería volver hacia el ' + fecha(l.vuelve) : '') + '.</p>';
    }
    $('#contenido').innerHTML = html; return;
  }
  if (l.prestamo) html += msg('aviso', 'Prestado a <b>' + esc(l.prestamo.nombre) + '</b> (' + esc(l.prestamo.curso) + ') desde el ' + fecha(l.prestamo.desde) + '. Devolver antes del <b>' + fecha(l.prestamo.limite) + '</b>.');
  if (l.reserva) html += msg('info', 'Reservado para <b>' + esc(l.reserva.nombre) + '</b> (' + esc(l.reserva.curso) + ') hasta el ' + fecha(l.reserva.caduca) + '.');
  if (l.revisar) html += msg('aviso', '⚠ ' + esc(l.revisar));
  html += '<div class="acciones">';
  if (l.estado === 'Prestado') {
    html += '<button class="b" ' + on(async (e, b) => { try { await conBoton(b, () => api('devolver', l.codigo)); cambiosHechos(); aviso('Devuelto'); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Registrar devolución</button>';
    html += '<button class="b sec" ' + on(async (e, b) => { try { const f = await conBoton(b, () => api('renovar', l.prestamo.id)); aviso('Renovado hasta el ' + fecha(f)); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Renovar</button>';
  }
  if (l.estado === 'Reservado') {
    html += '<button class="b ok" ' + on(async (e, b) => { try { await conBoton(b, () => api('prestar', l.codigo, l.reserva.lector, true)); cambiosHechos(); aviso('Entregado a ' + l.reserva.nombre); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Entregar a ' + esc(l.reserva.nombre.split(' ')[0]) + '</button>';
    html += '<button class="b peligro" ' + on(async () => { try { await api('cancelarReserva', l.reserva.id); cambiosHechos(); fichaLibro(l.codigo); } catch (er) { aviso(textoError(er)); } }) + '>Cancelar reserva</button>';
  }
  if (l.estado === 'Disponible') {
    html += '<button class="b" ' + on(() => elegirParaLibro(l, 'prestar')) + '>Prestar…</button>';
    html += '<button class="b sec" ' + on(() => elegirParaLibro(l, 'reservar')) + '>Reservar para…</button>';
  }
  html += '<button class="b sec" ' + on(() => editarLibro(l)) + '>Editar</button>';
  html += '<button class="b sec" ' + on(() => ventanaQR(l)) + '>Etiqueta QR</button></div><div id="f-extra"></div>';
  $('#contenido').innerHTML = html;
}

function elegirParaLibro(l, que) {
  $('#f-extra').innerHTML = '<label>' + (que === 'prestar' ? '¿A quién se lo prestas?' : '¿Para quién es la reserva?') + '</label><div id="f-sel"></div>';
  selectorLector($('#f-sel'), async x => {
    try {
      if (que === 'prestar') {
        let r = await api('prestar', l.codigo, x.id, false);
        if (r.aviso) { if (!await confirmar(esc(r.aviso) + '<br><br>¿Prestar igualmente?', 'Prestar igualmente')) return; r = await api('prestar', l.codigo, x.id, true); }
        aviso('Prestado a ' + x.nombre + ' hasta el ' + fecha(r.limite));
      } else {
        const r = await api('reservarPara', l.codigo, x.id);
        aviso('Reservado para ' + x.nombre + ' hasta el ' + fecha(r.caduca));
      }
      cambiosHechos(); fichaLibro(l.codigo);
    } catch (e) { $('#f-extra').insertAdjacentHTML('beforeend', msg('error', esc(textoError(e)))); }
  });
}

async function admLibros() {
  let cat;

  const ejemplares = [];
  cat.forEach(g => g.ejemplares.forEach(x => ejemplares.push(x)));

    '<div class="tarjeta"><div class="fila"><input id="al-q" class="crece" placeholder="Buscar por código, título, autor, ISBN…" autocomplete="off">' +

    '<select id="al-f" style="width:auto"><option value="">Todos</option><option value="avisos">Con avisos (' + nAvisos + ')</option><option value="provisional">Código provisional</option><option value="tejuelo">Pendientes de tejuelo</option><option value="baja">Dados de baja</option></select></div>' +
    '<div class="fila" style="margin-top:10px"><button class="b" ' + on(() => editarLibro(null)) + '>+ Nuevo libro</button></div></div>' +
    '<div class="cuadros">' +
    '<div class="tarjeta"><h3 class="nivel-t" style="--c:#ee712a">Imprimir</h3><p class="peq suave" style="margin-top:0">De los libros que se ven en la lista de abajo (usa los filtros, por ejemplo «Pendientes de tejuelo»).</p>' +
    '<div class="fila"><button class="b sec" id="al-imp">' + ico('qr') + ' Etiquetas QR</button><button class="b sec" id="al-tej">' + ico('marcador') + ' Tejuelos</button></div></div>' +
    '<div class="tarjeta"><h3 class="nivel-t" style="--c:#009abb">Búsqueda automática</h3><p class="peq suave" style="margin-top:0">Busca por ISBN en Google Books y Open Library los datos que falten.</p>' +
    '<div class="fila"><button class="b sec" id="al-por">' + ico('estanteria') + ' Buscar portadas</button><button class="b sec" id="al-sin">' + ico('lista') + ' Buscar sinopsis</button></div></div>' +
    '</div><div id="al-res"></div>';
  if (S.filtroLibros) { $('#al-f').value = S.filtroLibros; S.filtroLibros = ''; }
  $('#al-por').onclick = () => busquedaAutomatica($('#al-por'), 'buscarPortadas', 'portadas', 'Los libros sin portada se ven con una portada dibujada. Puedes poner una a mano al editar el libro.');
  $('#al-sin').onclick = () => busquedaAutomatica($('#al-sin'), 'buscarSinopsis', 'sinopsis', 'Puedes escribir o pegar la sinopsis a mano al editar el libro.');

  let max = 80;
  const filtrar = () => {
    const q = $('#al-q').value, et = $('#al-e').value, f = $('#al-f').value;
    return ejemplares.filter(x =>
      (!et || (et === '-' ? !x.etapa : x.etapa === et)) &&
      (!f || (f === 'avisos' && x.revisar) || (f === 'provisional' && /PROVISIONAL/i.test(x.revisar)) || (f === 'tejuelo' && /tejuelo/i.test(x.revisar)) || (f === 'baja' && x.estado === 'Baja')) &&
      (!q || coincide(x.codigo + ' ' + x.titulo + ' ' + x.autor + ' ' + x.editorial + ' ' + x.isbn + ' ' + x.revisar, q)));
  };
  const pintar = () => {
    const r = filtrar();
    $('#al-res').innerHTML = '<p class="suave peq">' + r.length + ' ejemplar(es). Pulsa en uno para verlo o corregirlo.</p><div class="tabla"><table><tr><th>Código</th><th>Título</th><th class="ocultar-movil">Autor</th><th class="ocultar-movil">Etapa</th><th>Estado</th></tr>' +
      r.slice(0, max).map(x => '<tr class="clic" ' + on(() => editarLibro(x)) + '><td style="white-space:nowrap">' + esc(x.codigo || '—') + '</td><td>' + esc(x.titulo) + (x.revisar ? '<div><span class="etq aviso">⚠ ' + esc(x.revisar.length > 70 ? x.revisar.slice(0, 70) + '…' : x.revisar) + '</span></div>' : '') + '</td><td class="ocultar-movil">' + esc(x.autor) + '</td><td class="ocultar-movil">' + esc(x.etapa) + '</td><td>' + etiqueta(x.estado) + '</td></tr>').join('') +
      '</table></div>' + (r.length > max ? '<p><button class="b sec" ' + on(() => { max += 200; pintar(); }) + '>Ver más</button></p>' : '');
  };
  let t; ['#al-q', '#al-e', '#al-f'].forEach(s => $(s).addEventListener(s === '#al-q' ? 'input' : 'change', () => { clearTimeout(t); max = 80; t = setTimeout(pintar, 150); }));
  $('#al-imp').onclick = () => {
    const r = filtrar().filter(x => x.codigo);
    if (!r.length) return aviso('No hay libros en la lista.');
    if (r.length > 300) return aviso('Son ' + r.length + ' etiquetas. Filtra un poco más (máximo 300 de una vez).');
    imprimirEtiquetas(r);
  };
  $('#al-tej').onclick = () => {
    const r = filtrar().filter(x => x.codigo);
    if (!r.length) return aviso('No hay libros en la lista.');
    if (r.length > 500) return aviso('Son ' + r.length + ' tejuelos. Filtra un poco más (máximo 500 de una vez).');
    imprimirTejuelos(r);
  };
  pintar();
}

async function busquedaAutomatica(b, funcion, que, nota) {
  const texto = b.innerHTML;
  let ok = 0, total = 0, saltar = [], error = '';
  b.disabled = true;
  try {
    for (let vuelta = 0; vuelta < 80; vuelta++) {
      b.textContent = 'Buscando ' + que + '… ' + ok + ' encontradas de ' + total;
      const r = await api(funcion, vuelta === 0, saltar);
      ok += r.encontrados; total += r.buscados; saltar = saltar.concat(r.fallidas || []);
      if (r.error) { error = r.error; break; }
      if (!r.quedan || !r.buscados) break;
    }
    cambiosHechos();
    abrirVentana('<h2>Búsqueda de ' + que + '</h2>' + (error && !total ? msg('error', esc(error)) :
      msg('ok', '<b>' + ok + '</b> ' + que + ' encontradas de <b>' + total + '</b> libros con ISBN.') +
      (saltar.length ? msg('aviso', saltar.length + ' libros no se han podido consultar ahora; pulsa el botón otra vez más tarde para reintentarlos.') : '')) +
      '<p class="peq suave">' + nota + '</p>');
  } catch (e) { aviso(textoError(e)); }
  finally { b.disabled = false; b.innerHTML = texto; }
}

function editarLibro(l) {
  const nuevo = !l;
  l = l || { codigo: '', etapa: '', titulo: '', autor: '', editorial: '', isbn: '', genero: '', observaciones: '', revisar: '' };
  const campo = (id, txt, valor, extra) => '<div class="' + (extra || '') + '"><label>' + txt + '</label><input id="el-' + id + '" value="' + esc(valor) + '"></div>';
  abrirVentana('<h2>' + (nuevo ? 'Nuevo libro' : 'Editar libro') + '</h2>' +
    (nuevo ? '<div class="fila"><div class="crece"><label>ISBN (si lo tiene, rellena el resto solo)</label><input id="el-isbn" placeholder="978…"></div><button class="b sec" id="el-buscar" style="align-self:flex-end">Buscar datos</button></div><div id="el-isbn-msg"></div>' : '') +
    '<div class="rejilla">' +
    campo('titulo', 'Título *', l.titulo, 'ancho') + campo('autor', 'Autor', l.autor) + campo('editorial', 'Editorial', l.editorial) +
    '<div><label>Etapa</label><select id="el-etapa"><option value="">—</option>' + S.info.etapas.map(e => '<option' + (e === l.etapa ? ' selected' : '') + '>' + esc(e) + '</option>').join('') + '</select></div>' +
    campo('codigo', 'Código' + (nuevo ? ' (vacío = siguiente libre)' : ''), l.codigo) +
    (nuevo ? '' : campo('isbn', 'ISBN', l.isbn)) + campo('genero', 'Género', l.genero) +
    (nuevo ? '<div><label>Nº de ejemplares iguales</label><input id="el-n" type="number" min="1" max="50" value="1"></div>' : '') +
    '<div class="ancho"><label>Portada (dirección de la imagen)</label><div class="fila" style="flex-wrap:nowrap;align-items:flex-start"><input id="el-portada" value="' + esc(/^https?:/.test(l.portada || '') ? l.portada : '') + '" placeholder="Vacío = portada dibujada automáticamente">' +
      '<span id="el-prev">' + portadaHtml({ titulo: l.titulo || 'Título', autor: l.autor, etapa: l.etapa, portada: l.portada, ejemplares: [] }, 'mini') + '</span></div>' +
      '<div class="peq suave" style="margin-top:4px">Para poner una portada a mano: búscala en Google Imágenes, haz clic derecho sobre ella → «Copiar dirección de imagen» y pégala aquí.</div></div>' +
    '<div class="ancho"><label>Sinopsis</label><textarea id="el-sinopsis" style="min-height:110px"' + (nuevo ? '' : ' disabled placeholder="Cargando…"') + '></textarea></div>' +
    '<div class="ancho"><label>Observaciones</label><textarea id="el-observaciones">' + esc(l.observaciones) + '</textarea></div>' +
    (nuevo ? '' : '<div class="ancho"><label>Avisos para revisar</label><textarea id="el-revisar" placeholder="Sin avisos">' + esc(l.revisar) + '</textarea></div>') +
    '</div><div id="el-msg"></div><div class="acciones"><button class="b" id="el-guardar">Guardar</button>' +
    (nuevo ? '' : (l.revisar ? '<button class="b ok" id="el-rev">✓ Marcar como revisado</button>' : '') +
      '<button class="b sec" ' + on(() => ventanaQR(l)) + '>Etiqueta QR</button>' +
      '<button class="b sec" ' + on(() => historialLibro(l)) + '>Préstamos de este libro</button>' +
      (l.estado === 'Baja' ? '<button class="b sec" id="el-recu">Recuperar (quitar la baja)</button>' : '<button class="b peligro" id="el-baja">Dar de baja</button>')) +
    '</div>');
  const val = id => { const e = $('#el-' + id); return e ? e.value : undefined; };
  const recogida = () => { const d = {}; ['titulo', 'autor', 'editorial', 'etapa', 'codigo', 'isbn', 'genero', 'observaciones', 'revisar', 'portada'].forEach(k => { const v = val(k); if (v !== undefined) d[k] = v; });
    if (!$('#el-sinopsis').disabled) d.sinopsis = val('sinopsis');
    return d; };
  if (!nuevo) api('leerSinopsis', l.fila).then(t => { const e = $('#el-sinopsis'); if (e) { e.value = t; e.disabled = false; e.placeholder = 'Sin sinopsis'; } }).catch(() => {});
  $('#el-portada').addEventListener('input', () => { $('#el-prev').innerHTML = portadaHtml({ titulo: val('titulo') || 'Título', autor: val('autor'), etapa: val('etapa'), portada: val('portada'), ejemplares: [] }, 'mini'); });
  const tras = (texto) => { cambiosHechos(); cerrarVentana(); aviso(texto); if (S.pestana === 'admin') vistaAdmin(); else if (S.pestana === 'catalogo') vistaCatalogo(); };
  if (nuevo) {
    const sugerir = async () => { const e = val('etapa'); $('#el-codigo').placeholder = e ? 'Se asignará ' + await api('siguienteCodigo', e).catch(() => '') : 'Elige la etapa'; };
    $('#el-etapa').addEventListener('change', sugerir);
    $('#el-buscar').onclick = async () => {
      try {
        const r = await conBoton($('#el-buscar'), () => api('buscarISBN', val('isbn')));
        if (r.noEncontrado) { $('#el-isbn-msg').innerHTML = msg('aviso', 'No he encontrado ese ISBN. Rellena los datos a mano.'); return; }
        ['titulo', 'autor', 'editorial', 'portada', 'sinopsis'].forEach(k => { if (r[k]) $('#el-' + k).value = r[k]; });
        $('#el-portada').dispatchEvent(new Event('input'));
        $('#el-isbn-msg').innerHTML = msg('ok', 'Datos encontrados. Revísalos antes de guardar.');
      } catch (e) { $('#el-isbn-msg').innerHTML = msg('error', esc(textoError(e))); }
    };
    $('#el-isbn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#el-buscar').click(); });
  }
  $('#el-guardar').onclick = async () => {
    try {
      const r = await conBoton($('#el-guardar'), () => api('guardarLibro', nuevo ? null : l.fila, recogida(), nuevo ? val('n') : null));
      tras(r.nuevos ? 'Libro dado de alta: ' + r.nuevos.join(', ') : r.sinCambios ? 'No había cambios' : 'Cambios guardados');
    } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-rev')) $('#el-rev').onclick = async () => {
    try { await conBoton($('#el-rev'), () => api('guardarLibro', l.fila, Object.assign(recogida(), { revisar: '' }))); tras('Marcado como revisado'); }
    catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-baja')) $('#el-baja').onclick = async () => {
    const motivo = prompt('¿Por qué se da de baja? (perdido, deteriorado…)');
    if (motivo === null) return;
    try { await api('bajaLibro', l.fila, motivo); tras('Libro dado de baja'); } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
  if ($('#el-recu')) $('#el-recu').onclick = async () => {
    try { await api('recuperarLibro', l.fila); tras('Libro recuperado'); } catch (e) { $('#el-msg').innerHTML = msg('error', esc(textoError(e))); }
  };
}

async function historialLibro(l) {
  abrirVentana('<h2>Préstamos de «' + esc(l.titulo) + '»</h2><div class="cargando">Cargando…</div>');
  try {
    const h = await api('historialLibro', l.codigo);
    $('#contenido').innerHTML = '<h2>Préstamos de «' + esc(l.titulo) + '»</h2>' + (h.length ? '<div class="tabla"><table><tr><th>Lector</th><th>Prestado</th><th>Devuelto</th></tr>' + h.map(p => '<tr><td>' + esc(p.nombre) + '<div class="peq suave">' + esc(p.curso) + '</div></td><td>' + fecha(p.desde) + '</td><td>' + (p.devuelto ? fecha(p.devuelto) : '<span class="etq Prestado">Aún no</span>') + '</td></tr>').join('') + '</table></div>' : '<p class="suave">Este libro no se ha prestado nunca.</p>');
  } catch (e) { $('#contenido').innerHTML = msg('error', esc(textoError(e))); }
}
