<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · Salesianas Nervión</title>
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<script>
  // Dirección de la web de la biblioteca (Apps Script → Implementar → URL de la aplicación web).
  const DESTINO = 'https://script.google.com/a/macros/nervion.salesianas.org/s/AKfycbzJk1Fdh_5egLd4GI7xa6-a6X-1P5bg-L5AlehkgGGD70jt1PSsBU5rRQExyS9RkapEkw/exec';
  // Se conserva "?libro=…" para que los QR abran directamente la ficha del libro.
  if (/^https:\/\//.test(DESTINO)) location.replace(DESTINO + location.search);
</script>
<style>
  :root { --azul: #009abb; --verde: #b4be00; --fondo: #F8FAFC; --texto: #1E293B; --suave: #64748B; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #0F1720; --texto: #E7ECF2; --suave: #93A2B3; --azul: #29b6d4; color-scheme: dark; } }
  :root[data-theme="dark"] { --fondo: #0F1720; --texto: #E7ECF2; --suave: #93A2B3; --azul: #29b6d4; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--fondo); color: var(--texto); font: 16px/1.5 "Fira Sans", system-ui, sans-serif; padding: 16px; }
  img { height: 56px; margin-bottom: 18px; }
  h1 { color: var(--azul); font-size: 24px; margin: 0 0 6px; }
  p { color: var(--suave); margin: 0; }
  a { color: var(--azul); font-weight: 700; }
</style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="Salesianas Nervión">
    <h1>Biblioteca</h1>
    <p id="m">Abriendo la biblioteca…</p>
  </main>
  <script>
    if (/^https:\/\//.test(DESTINO)) {
      document.getElementById('m').innerHTML = 'Abriendo la biblioteca… Si no se abre, <a href="' + DESTINO + location.search + '">pulsa aquí</a>.';
    } else {
      document.getElementById('m').textContent = 'La web de la biblioteca todavía no está configurada.';
    }
  </script>
</body>
</html>
